<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팟캐스트 · 라이브 토크 | MYWAY.KR</title>
<meta name="description" content="경제·시사·교양·토크 유튜브 라이브와 최신 회차를 한 화면에서">
<style>
  *, *::before, *::after { box-sizing:border-box; }
  :root { --nav-grad:linear-gradient(95deg,#7ed6fb 10%,#b176f3 90%); --ink:#1f2740; --sub:#8590ad; --line:#dfe3ec; --accent:#e5384f; }
  html, body { margin:0; height:100%; background:#fff; font-family:"Segoe UI","맑은 고딕",Arial,sans-serif; color:var(--ink); }
  body { overflow:hidden; -webkit-user-select:none; user-select:none; }
  input, textarea { -webkit-user-select:text; user-select:text; }
  img { -webkit-user-drag:none; }

  /* ===== 화면 1: 카드 목록 (people2 디자인) ===== */
  #listView { position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .topbar { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.96); backdrop-filter:saturate(180%) blur(8px); -webkit-backdrop-filter:saturate(180%) blur(8px); padding:12px 14px 10px; border-bottom:1px solid #eef0f4; }
  .cat-nav { display:flex; gap:8px; justify-content:safe center; overflow-x:auto; scrollbar-width:none; }
  .cat-nav::-webkit-scrollbar { display:none; }
  .cat-btn { font:inherit; font-size:.88rem; font-weight:600; padding:7px 14px; border-radius:999px; border:1.5px solid var(--line); background:#fff; color:#4a5170; cursor:pointer; white-space:nowrap; flex:0 0 auto; transition:all .15s; }
  .cat-btn:hover { background:#f4f6fb; border-color:#c7cee0; }
  .cat-btn.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .cat-btn .n { margin-left:4px; font-size:.72rem; opacity:.65; font-weight:500; }
  .section { width:100%; max-width:1100px; padding:18px 14px 40px; margin:0 auto; }
  .ghead { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 14px; }
  .gtitle { font-size:1rem; font-weight:700; letter-spacing:-.3px; margin:0; }
  .gtitle .sub { font-size:.8rem; font-weight:500; color:var(--sub); margin-left:6px; }
  .find { width:200px; max-width:45vw; height:32px; border:1.5px solid var(--line); border-radius:999px; padding:0 14px; font:inherit; font-size:.85rem; color:var(--ink); outline:none; }
  .find:focus { border-color:#b176f3; }
  .masonry { column-count:4; column-gap:12px; }
  .card { display:block; break-inside:avoid; -webkit-column-break-inside:avoid; margin:0 0 12px; border-radius:10px; overflow:hidden; position:relative; cursor:pointer; transform:translateZ(0); }
  .face { aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; padding:14px; text-align:center; color:#fff; background:linear-gradient(150deg,var(--c1),var(--c2)); transition:transform .35s ease; }
  .card:hover .face { transform:scale(1.03); }
  .face svg { width:28px; height:28px; opacity:.9; }
  .face b { font-size:1.2rem; font-weight:800; line-height:1.25; letter-spacing:-.3px; word-break:keep-all; text-shadow:0 2px 8px rgba(0,0,0,.18); }
  .face i { font-style:normal; font-size:.74rem; font-weight:600; opacity:.92; }
  .tag { position:absolute; left:8px; top:8px; font-size:.66rem; font-weight:800; color:#fff; background:rgba(0,0,0,.28); padding:2px 7px; border-radius:999px; }
  .tag.live { background:var(--accent); }
  .star { position:absolute; right:6px; top:4px; border:0; background:none; font-size:20px; line-height:1; cursor:pointer; color:rgba(255,255,255,.55); padding:4px; text-shadow:0 1px 3px rgba(0,0,0,.25); }
  .star.on { color:#ffd23f; }
  .empty-msg { color:var(--sub); font-size:.88rem; padding:30px 0; text-align:center; column-span:all; }
  @media (max-width:900px){ .masonry { column-count:3; } }
  @media (max-width:600px){ .masonry { column-count:2; column-gap:10px; } .card { margin-bottom:10px; } .cat-nav { justify-content:flex-start; } .face b { font-size:1.05rem; } }
  .foot { text-align:center; padding:6px 14px 70px; font-size:.78rem; color:var(--sub); line-height:1.6; }
  .foot a { color:#4a5170; font-weight:700; text-decoration:none; }

  /* ===== 화면 2: 재생 (임베드 내부 화면) ===== */
  #playView { position:absolute; inset:0; z-index:40; display:none; flex-direction:column; background:#111; }
  #playView.open { display:flex; }
  .pbar { flex:none; display:flex; align-items:center; gap:8px; padding:8px 12px; background:#fff; border-bottom:1px solid #eef0f4; }
  .back { flex:none; border:0; border-radius:999px; padding:7px 14px; font:inherit; font-size:.85rem; font-weight:700; color:#fff; background:var(--nav-grad); box-shadow:0 4px 12px rgba(177,118,243,.3); cursor:pointer; white-space:nowrap; }
  .now { flex:1; min-width:0; font-weight:700; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now small { color:var(--sub); font-weight:500; margin-left:6px; font-size:.78rem; }
  .mode { flex:none; display:flex; gap:6px; }
  .mode button { border:1.5px solid var(--line); background:#fff; padding:6px 12px; border-radius:999px; cursor:pointer; font:inherit; font-size:.8rem; font-weight:700; color:var(--ink); white-space:nowrap; }
  .mode button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .stage { flex:1; min-height:0; position:relative; }
  .stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .hint { flex:none; background:#fff; color:var(--sub); font-size:.75rem; padding:6px 12px; border-top:1px solid #eef0f4; min-height:28px; }
  @media (max-width:600px){ .pbar { flex-wrap:wrap; } .now { order:3; flex-basis:100%; font-size:.88rem; } }

  .home-fab { position:fixed; right:14px; bottom:14px; z-index:50; width:42px; height:42px; border-radius:50%; background:var(--nav-grad); color:#fff; display:flex; align-items:center; justify-content:center; text-decoration:none; box-shadow:0 6px 18px rgba(177,118,243,.35); }
  .home-fab svg { width:20px; height:20px; fill:currentColor; }
  #playView.open ~ .home-fab { bottom:44px; }
</style>
</head>
<body>

<div id="listView">
  <header class="topbar"><nav class="cat-nav" id="cats"></nav></header>
  <section class="section">
    <div class="ghead">
      <h2 class="gtitle">팟캐스트 <span class="sub" id="sub"></span></h2>
      <input class="find" id="find" type="search" placeholder="채널 찾기" autocomplete="off">
    </div>
    <div class="masonry" id="grid"></div>
  </section>
  <footer class="foot">ⓘ 각 채널이 유튜브에 공개한 <b>공식 라이브·영상</b>을 그대로 연결해 보여 주는 <b>비영리 개인 사이트</b>입니다. 영상을 저장하거나 다시 올리지 않습니다. 권리자 요청이 있으면 즉시 삭제합니다.<br><a href="https://myway.kr" target="_top">myway.kr</a></footer>
</div>

<div id="playView">
  <div class="pbar">
    <button type="button" class="back" id="back">← 목록</button>
    <div class="now" id="now"></div>
    <div class="mode" id="mode">
      <button type="button" data-m="live">🔴 라이브</button>
      <button type="button" data-m="latest">▶ 최신 회차</button>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="hint" id="hint"></div>
</div>

<a class="home-fab" href="https://myway.kr" target="_top" title="MYWAY.KR 홈"><svg viewBox="0 0 24 24"><path d="M12 3.2 2.5 11.4l1.3 1.5L5 11.85V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-8.15l1.2 1.05 1.3-1.5L12 3.2Z"/></svg></a>

<script>
/* ───── 채널 목록 (유튜브 공식 채널 ID) — 기존 podcast.html과 같은 목록 ─────
   mode: 처음 눌렀을 때 — live(지금 생방송) / latest(최신 회차·업로드 목록, 최신 영상이 맨 앞)
   vid가 있으면(24시간 방송) 그 영상으로 라이브 고정 */
const CHANNELS = [
  { slug:"3pro",      name:"삼프로TV",               cat:"경제",      id:"UChlv4GSd7OQl3js-jkLOnFA", mode:"latest", desc:"경제 · 아침 라이브" },
  { slug:"syuka",     name:"슈카월드",               cat:"경제",      id:"UCsJ6RuBiTVWRX156FVbeaGg", mode:"latest", desc:"경제 · 정기 라이브" },
  { slug:"ytnradio",  name:"YTN 라디오",             cat:"시사",      id:"UCwRljhjVWtLqAKbsWGPU_OA", vid:"SMQJyQ0UMvI", mode:"live", desc:"24시간 듣는 라디오" },
  { slug:"hanpan",    name:"CBS 박재홍의 한판승부",  cat:"시사",      id:"UCV9gIwasozKlwz5U2Sa2q6g", mode:"latest", desc:"CBS 라디오 · 평일 저녁" },
  { slug:"ytnsisa",   name:"YTN 시사",               cat:"시사",      id:"UCvWUqUT10RiJ6W8XiruqAiQ", mode:"latest", desc:"보도 · 시사 프로그램" },
  { slug:"gyeomson",  name:"겸손은힘들다 뉴스공장",  cat:"시사",      id:"UCAAvO0ehWox1bbym3rXKBZw", mode:"latest", desc:"시사 토크 · 아침 라이브" },
  { slug:"sinsa",     name:"신의한수",               cat:"시사",      id:"UCgOLQwRv1r2m9mhE1tfsn3Q", mode:"latest", desc:"시사 토크 · 라이브" },
  { slug:"jiyoon",    name:"김지윤의 지식Play",      cat:"교양",      id:"UCXql5C57vS4ogUt6CPEWWHA", mode:"latest", desc:"국제정치 · 역사 · 문화" },
  { slug:"videomug",  name:"비디오머그",             cat:"교양",      id:"UCMEbRpvuwTbXxGiyDb1mT8w", mode:"latest", desc:"SBS 지식뉴스" },
  { slug:"chim",      name:"침착맨",                 cat:"예능·토크", id:"UCUj6rrhMTR9pipbAWBAMvUQ", mode:"latest", desc:"토크 · 다시보기" },
  { slug:"chimlive",  name:"침착맨 원본 박물관",     cat:"예능·토크", id:"UCewitUbsXnyjvJjGgxa0IYw", mode:"latest", desc:"침착맨 생방송 송출" }
];
const CATS = ["전체", "즐겨찾기", "경제", "시사", "교양", "예능·토크"];
const COL = { "경제":["#ffd36b","#f08a3c"], "시사":["#7ed6fb","#3b6fe0"], "교양":["#8fd9a8","#2aa198"], "예능·토크":["#ff8fd0","#b176f3"] };
const MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/><path d="M8.5 21h7"/></svg>';

const FAV_KEY = "mywayPodcastFavsV1";   /* 기존 podcast.html 즐겨찾기(★)와 같은 저장 키 — 누를 때만 저장 */
let favs = [];
try { favs = JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(e) {}
let curCat = "전체", curSlug = "", curMode = "latest";

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inCat = c => curCat === "전체" ? true : curCat === "즐겨찾기" ? favs.includes(c.slug) : c.cat === curCat;
function saveFavs(){ try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e) {} }

function renderCats(){
  $("cats").innerHTML = CATS.map(c => {
    const n = c === "전체" ? CHANNELS.length : c === "즐겨찾기" ? favs.length : CHANNELS.filter(x => x.cat === c).length;
    return `<button class="cat-btn ${c===curCat?'on':''}" data-cat="${esc(c)}">${esc(c)}<span class="n">${n}</span></button>`;
  }).join("");
}
function renderGrid(){
  const q = ($("find").value || "").replace(/\s/g, "").toLowerCase();
  const list = CHANNELS.filter(c => (q ? true : inCat(c)) && (!q || c.name.replace(/\s/g,"").toLowerCase().includes(q)));
  $("sub").textContent = (q ? `“${$("find").value.trim()}”` : curCat) + " " + list.length;
  $("grid").innerHTML = list.length ? list.map(c => {
    const col = COL[c.cat] || ["#9aa6c7","#5d6b86"];
    return `<div class="card" data-slug="${esc(c.slug)}" title="${esc(c.name)}">
      <div class="face" style="--c1:${col[0]};--c2:${col[1]}">${MIC}<b>${esc(c.name)}</b><i>${esc(c.desc)}</i></div>
      <span class="tag ${c.vid?'live':''}">${c.vid ? '24H' : esc(c.cat)}</span>
      <button class="star ${favs.includes(c.slug)?'on':''}" data-fav="${esc(c.slug)}" title="즐겨찾기">★</button>
    </div>`;
  }).join("") : `<div class="empty-msg">${curCat === "즐겨찾기" && !q ? "카드 오른쪽 위 ★을 눌러 즐겨찾기를 추가하세요" : "채널이 없습니다"}</div>`;
}

/* ── 재생 화면 ── */
function renderMode(){
  $("mode").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.m === curMode));
  $("hint").textContent = curMode === "live"
    ? "지금 생방송 중일 때만 나와요. '재생할 수 없음'이 뜨면 생방송이 없는 시간이에요 → [▶ 최신 회차]"
    : "가장 최근 영상부터 나와요. 이전 회차는 화면 오른쪽 위 재생목록(≡) 버튼에서 고르세요.";
}
function play(slug, mode){
  const c = CHANNELS.find(x => x.slug === slug); if (!c) return;
  curSlug = c.slug; curMode = mode || c.mode;
  const q = "autoplay=1&playsinline=1&rel=0";
  const src = curMode === "live"
    ? (c.vid ? `https://www.youtube.com/embed/${c.vid}?${q}` : `https://www.youtube.com/embed/live_stream?channel=${c.id}&${q}`)
    : `https://www.youtube.com/embed/videoseries?list=UU${c.id.slice(2)}&${q}`;
  $("stage").innerHTML = `<iframe src="${src}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="${esc(c.name)}"></iframe>`;
  $("now").innerHTML = `${esc(c.name)}<small>${esc(c.cat)} · ${curMode === "live" ? "라이브" : "최신 회차"}</small>`;
  renderMode();
  $("playView").classList.add("open");
}
/* 목록으로 돌아가면 소리도 멈춤 */
function backToList(){ $("stage").innerHTML = ""; $("playView").classList.remove("open"); curSlug = ""; }

$("cats").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  curCat = b.dataset.cat; $("find").value = ""; renderCats(); renderGrid(); $("listView").scrollTop = 0;
});
$("find").addEventListener("input", renderGrid);
$("grid").addEventListener("click", e => {
  const s = e.target.closest("[data-fav]");
  if (s) { e.stopPropagation(); const k = s.dataset.fav; favs = favs.includes(k) ? favs.filter(x => x !== k) : favs.concat(k); saveFavs(); renderCats(); renderGrid(); return; }
  const card = e.target.closest(".card"); if (card) play(card.dataset.slug);
});
$("mode").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b && curSlug) play(curSlug, b.dataset.m); });
$("back").addEventListener("click", backToList);

renderCats(); renderGrid();
</script>

<script>
/* 복사 방지 */
(function(){
  const block = e => { const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return; e.preventDefault(); };
  ["contextmenu","selectstart","dragstart","copy","cut"].forEach(ev => document.addEventListener(ev, block));
  document.addEventListener("keydown", e => {
    const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    const k = (e.key || "").toLowerCase();
    if (k === "f12" || (e.ctrlKey && ["u","s","c","x","a"].includes(k)) || (e.ctrlKey && e.shiftKey && ["i","j","c"].includes(k))) e.preventDefault();
  });
})();
</script>
</body>
</html>
