<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MYWAY Music 디자인 샘플</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#0c0d14; --bg2:#14151f; --bg3:#1c1e2b; --line:#272a3a; --ink:#f3f2f8; --sub:#a3a6ba; --dim:#6f7388;
    --a1:#7ed6fb; --a2:#7d6fe8; --a3:#b176f3; --bar:76px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;
       -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;overflow:hidden;}
  input{user-select:text;-webkit-user-select:text;}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--a1);outline-offset:2px;}
  .app{height:100%;display:flex;flex-direction:column;}
  /* 배경: 지금 재생 중인 가수의 색으로 은은하게 물듦 */
  .glow{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;transition:background .6s;
        background:radial-gradient(900px 480px at 22% -8%, var(--g1,#2b2f6b) 0%, transparent 70%),radial-gradient(700px 420px at 92% 0%, var(--g2,#3a2456) 0%, transparent 70%);}

  /* ── 상단 ── */
  .top{position:relative;z-index:3;flex:none;display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid var(--line);background:rgba(12,13,20,.72);backdrop-filter:blur(14px);}
  .brand{display:flex;align-items:baseline;gap:7px;font-family:Fraunces,serif;font-weight:800;font-size:21px;letter-spacing:-.01em;white-space:nowrap;}
  .brand i{font-weight:700;background:linear-gradient(95deg,var(--a1),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .find{flex:1 1 0;min-width:0;max-width:520px;display:flex;align-items:center;gap:10px;height:42px;padding:0 15px;border-radius:12px;background:var(--bg3);border:1px solid var(--line);}
  .find svg{width:17px;height:17px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round;flex:none;}
  .find input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:14.5px;}
  .find input::placeholder{color:var(--dim);}
  .top .sp{flex:1;}
  .tag{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;}

  /* ── 본문 ── */
  .main{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;padding:0 0 calc(var(--bar) + 28px);scrollbar-width:thin;scrollbar-color:#3a3d52 transparent;}
  .wrap{max-width:1320px;margin:0 auto;padding:0 28px;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:18px 0 4px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none;height:36px;padding:0 15px;border-radius:10px;background:var(--bg3);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--sub);transition:.15s;}
  .chip:hover{color:var(--ink);border-color:#3a3e55;}
  .chip.on{background:var(--ink);color:#11121a;border-color:var(--ink);}
  .chip .n{margin-left:6px;font-weight:500;opacity:.6;font-size:12px;}
  .sec{margin-top:30px;}
  .sec-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;}
  .sec-h .eyebrow{display:block;font-size:11.5px;letter-spacing:.14em;color:var(--dim);font-weight:700;margin-bottom:3px;}
  .sec-h h2{margin:0;font-family:Fraunces,Pretendard,serif;font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1;}
  .sec-h .sp{flex:1;}
  .ghost{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--sub);display:inline-flex;align-items:center;gap:7px;}
  .ghost:hover{color:var(--ink);border-color:#444861;}
  .ghost svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* 커버(이미지 없으면 장르색 + 첫 글자) */
  .cv{position:relative;flex:none;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(140deg,var(--c1),var(--c2));font-family:Fraunces,Pretendard,serif;font-weight:800;color:rgba(255,255,255,.92);}
  .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

  /* 빠른 선곡 */
  .picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 22px;}
  .pick{display:flex;align-items:center;gap:14px;padding:8px;border-radius:12px;text-align:left;min-width:0;transition:background .15s;}
  .pick:hover{background:rgba(255,255,255,.06);}
  .pick .cv{width:56px;height:56px;font-size:22px;}
  .pick .t{min-width:0;}
  .pick b{display:block;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pick span{display:block;margin-top:3px;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* 장르 카드 줄 */
  .moods{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
  .moods::-webkit-scrollbar{display:none;}
  .mood{flex:none;width:188px;height:128px;border-radius:14px;padding:14px;text-align:left;position:relative;overflow:hidden;
        background:linear-gradient(150deg,var(--c1),var(--c2));transition:transform .18s;}
  .mood:hover{transform:translateY(-3px);}
  .mood::after{content:"";position:absolute;right:-26px;bottom:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.16);}
  .mood b{position:absolute;left:14px;bottom:12px;font-size:18px;font-weight:800;line-height:1.2;text-shadow:0 1px 10px rgba(0,0,0,.35);}
  .mood small{font-size:11.5px;font-weight:700;letter-spacing:.06em;opacity:.85;}

  /* 가수 그리드 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:20px 16px;}
  .card{text-align:left;min-width:0;}
  .card .cv{width:100%;aspect-ratio:1;border-radius:12px;font-size:46px;transition:transform .18s, box-shadow .18s;}
  .card:hover .cv{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.45);}
  .card .play{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(6px);transition:.18s;}
  .card .play svg{width:16px;height:16px;fill:#11121a;margin-left:2px;}
  .card:hover .play{opacity:1;transform:none;}
  .card b{display:block;margin-top:10px;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card span{display:block;margin-top:2px;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .empty{padding:50px 0;text-align:center;color:var(--dim);font-size:14px;}
  .foot{margin:44px 0 0;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);text-align:center;}
  .foot a{color:var(--a1);text-decoration:none;}

  /* ── 재생 화면 ── */
  .now{display:none;}
  body.playing-view .home{display:none;}
  body.playing-view .now{display:block;}
  .now-grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:34px;padding-top:22px;align-items:start;}
  .back{height:38px;padding:0 14px 0 10px;margin-bottom:14px;}
  .stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 30px 70px rgba(0,0,0,.55);}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .meta{display:flex;align-items:center;gap:16px;margin-top:20px;}
  .meta .cv{width:64px;height:64px;border-radius:12px;font-size:26px;}
  .meta h1{margin:0;font-family:Fraunces,Pretendard,serif;font-weight:800;font-size:30px;letter-spacing:-.02em;}
  .meta p{margin:4px 0 0;font-size:13.5px;color:var(--sub);}
  .side{position:sticky;top:18px;background:rgba(20,21,31,.72);border:1px solid var(--line);border-radius:16px;overflow:hidden;backdrop-filter:blur(10px);}
  .tabs{display:flex;border-bottom:1px solid var(--line);}
  .tabs button{flex:1;height:48px;font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--dim);border-bottom:2px solid transparent;}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--ink);}
  .queue{max-height:calc(100vh - 290px);min-height:240px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3a3d52 transparent;}
  .q{display:flex;align-items:center;gap:13px;width:100%;padding:10px 16px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05);}
  .q:hover{background:rgba(255,255,255,.05);}
  .q.on{background:rgba(125,111,232,.2);}
  .q .cv{width:44px;height:44px;border-radius:7px;font-size:17px;}
  .q .t{flex:1;min-width:0;}
  .q b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .q span{display:block;margin-top:2px;font-size:12.5px;color:var(--sub);}
  .q .eq{flex:none;width:16px;height:14px;display:none;align-items:flex-end;gap:2px;}
  .q.on .eq{display:flex;}
  .q .eq i{flex:1;background:var(--a1);border-radius:1px;height:40%;}
  body.is-playing .q.on .eq i{animation:eq 0.9s ease-in-out infinite;}
  .q .eq i:nth-child(2){animation-delay:.2s !important;height:90%;}
  .q .eq i:nth-child(3){animation-delay:.4s !important;height:60%;}
  @keyframes eq{0%,100%{height:25%}50%{height:100%}}

  /* ── 하단 재생바 ── */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:5;height:var(--bar);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;
       padding:0 22px;padding-bottom:env(safe-area-inset-bottom,0);background:rgba(22,23,33,.94);border-top:1px solid var(--line);backdrop-filter:blur(16px);}
  .prog{position:absolute;left:0;right:0;top:-2px;height:3px;background:rgba(255,255,255,.1);}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a1),var(--a3));}
  .bar .l{display:flex;align-items:center;gap:13px;min-width:0;text-align:left;}
  .bar .l .cv{width:48px;height:48px;font-size:19px;}
  .bar .l b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar .l span{display:block;margin-top:2px;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ctl{display:flex;align-items:center;gap:8px;}
  .ctl button{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .ctl button:hover{background:rgba(255,255,255,.08);}
  .ctl button:disabled{opacity:.35;cursor:default;background:none;}
  .ctl svg{width:22px;height:22px;fill:currentColor;}
  .ctl .pp{width:54px;height:54px;background:var(--ink);color:#11121a;}
  .ctl .pp:hover{background:#fff;}
  .ctl .pp:disabled{background:#3a3d52;color:#888;}
  .ctl .tg.on{color:var(--a1);}
  .bar .r{display:flex;align-items:center;justify-content:flex-end;gap:14px;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .homebtn{position:fixed;right:18px;bottom:calc(var(--bar) + 16px);z-index:6;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
           background:linear-gradient(135deg,var(--a2),var(--a3));box-shadow:0 8px 22px rgba(0,0,0,.45);text-decoration:none;}
  .homebtn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  @media (max-width:1080px){
    .picks{grid-template-columns:repeat(2,minmax(0,1fr));}
    .now-grid{grid-template-columns:1fr;gap:22px;}
    .side{position:static;}
    .queue{max-height:none;}
  }
  @media (max-width:640px){
    :root{--bar:68px;}
    .top{gap:10px;padding:10px 14px;}
    .brand{font-size:18px;}
    .tag,.top .sp{display:none;}
    .wrap{padding:0 14px;}
    .sec{margin-top:24px;}
    .sec-h h2{font-size:24px;}
    .picks{grid-template-columns:1fr;}
    .pick:nth-child(n+7){display:none;}   /* 핸드폰은 6명만 */
    .mood{width:150px;height:104px;}
    .mood b{font-size:16px;}
    .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px;}
    .card .cv{font-size:32px;}
    .card .play{display:none;}
    .now-grid{padding-top:12px;}
    .stage{border-radius:12px;}
    .meta h1{font-size:23px;}
    .meta .cv{width:52px;height:52px;}
    .bar{grid-template-columns:minmax(0,1fr) auto;padding:0 12px;gap:8px;}
    .bar .r,.ctl .tg,.ctl .pv{display:none;}
    .ctl button{width:42px;height:42px;}
    .ctl .pp{width:46px;height:46px;}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important;} }
</style>
</head>
<body>
<div class="glow" id="glow"></div>
<div class="app">
  <header class="top">
    <div class="brand">MYWAY <i>Music</i></div>
    <label class="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="find" type="search" placeholder="가수 찾기" autocomplete="off" aria-label="가수 찾기"></label>
    <span class="sp"></span><span class="tag">디자인 샘플</span>
  </header>

  <main class="main" id="main">
    <div class="wrap">
      <!-- 홈 -->
      <div class="home">
        <div class="chips" id="chips"></div>
        <section class="sec" id="secPicks">
          <div class="sec-h"><div><span class="eyebrow" id="pickEyebrow">오늘은 이 가수 어때요</span><h2>빠른 선곡</h2></div><span class="sp"></span>
            <button class="ghost" id="shuffleBtn" type="button"><svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>다른 가수 보기</button></div>
          <div class="picks" id="picks"></div>
        </section>
        <section class="sec" id="secMoods">
          <div class="sec-h"><div><span class="eyebrow">분위기로 고르기</span><h2>장르</h2></div></div>
          <div class="moods" id="moods"></div>
        </section>
        <section class="sec">
          <div class="sec-h"><div><span class="eyebrow" id="gridEyebrow">전체</span><h2>가수 <span id="gridCount" style="font-size:.55em;color:var(--dim);font-family:Pretendard,sans-serif;font-weight:600;"></span></h2></div></div>
          <div class="grid" id="grid"></div>
        </section>
      </div>

      <!-- 재생 화면 -->
      <div class="now" id="now">
        <div class="now-grid">
          <div>
            <button class="ghost back" id="backBtn" type="button"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>가수 목록</button>
            <div class="stage" id="stage"></div>
            <div class="meta"><div class="cv" id="metaCv"></div><div><h1 id="metaName"></h1><p id="metaSub"></p></div></div>
          </div>
          <aside class="side">
            <div class="tabs"><button type="button" class="on" data-tab="same">같은 장르</button><button type="button" data-tab="all">전체 가수</button></div>
            <div class="queue" id="queue"></div>
          </aside>
        </div>
      </div>

      <footer class="foot"><a href="https://myway.kr">myway.kr</a> · MYWAY Music 디자인 샘플</footer>
    </div>
  </main>
</div>

<div class="bar" id="bar">
  <div class="prog"><i id="progFill"></i></div>
  <button class="l" id="barInfo" type="button" title="재생 화면 열기"><div class="cv" id="barCv" style="--c1:#2a2d3f;--c2:#1c1e2b;">♪</div><div style="min-width:0"><b id="barTitle">가수를 골라 주세요</b><span id="barSub">누르면 화면 안에서 바로 재생됩니다</span></div></button>
  <div class="ctl">
    <button type="button" class="tg" id="shufTg" title="곡 순서 섞기" aria-label="곡 순서 섞기" disabled><svg viewBox="0 0 24 24"><path d="M16 3h5v5h-2V6.4l-4.3 4.3-1.4-1.4L17.6 5H16V3zM3 6h4.6l10 10H19v-2h2v5h-5v-2h1.6l-.6-.6-9.2-9.2-.4-.2H3V6zm5.3 8.9 1.4 1.4L7.6 18.4H3v-2h3.8l1.5-1.5zM21 14v5h-5v-2h3v-3h2z" style="display:none"/><path d="M10.6 9.2 5.4 4H3v2h1.6l4.6 4.6 1.4-1.4zM14.5 4l2 2-13 13 1.4 1.4 13-13 2.1 2.1V4h-5.5zm.3 9.4-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2.1 2-3.1-3.1z"/></svg></button>
    <button type="button" class="pv" id="prevBtn" title="이전 곡" aria-label="이전 곡" disabled><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button type="button" class="pp" id="ppBtn" title="재생/일시정지" aria-label="재생/일시정지" disabled><svg viewBox="0 0 24 24" id="ppIcon"><path d="M8 5v14l11-7z"/></svg></button>
    <button type="button" id="nextBtn" title="다음 곡" aria-label="다음 곡" disabled><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button type="button" class="tg" id="loopTg" title="반복" aria-label="반복" disabled><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
  </div>
  <div class="r"><span id="timeTxt">0:00 / 0:00</span></div>
</div>

(function(){
  var CATS = [['all','전체'],['ballad','발라드'],['idol','아이돌'],['trot','트로트'],['rock','록·밴드'],['hiphop','힙합·R&B'],['indie','인디·싱어송라이터'],['old','7080'],['y90','90·2000년대'],['new','신인'],['oldpop','올드팝'],['pop','해외 팝'],['ch','음악채널']];
  var CAT_NAME = {}; CATS.forEach(function(c){ CAT_NAME[c[0]] = c[1]; });
  var COL = {ballad:['#3d6fd6','#1f2b6b'],idol:['#e0559c','#6a2bb0'],trot:['#f08a3c','#b02a4a'],rock:['#56617d','#1b2033'],hiphop:['#7a52e0','#231a45'],indie:['#2fa58a','#16506a'],
             old:['#c9973e','#6b3f1c'],y90:['#2f9bc4','#263f9e'],'new':['#74c24a','#136b62'],oldpop:['#b5654a','#4a2334'],pop:['#d04a6a','#3b2a7a'],ch:['#6c7aa8','#262c47'],all:['#7d6fe8','#3a2456']};
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function cat0(p){ return (p.c && p.c[0]) || 'ballad'; }
  function col(p){ return COL[cat0(p)] || COL.ballad; }
  function catLabel(p){ return (p.c || []).map(function(c){ return CAT_NAME[c] || c; }).join(' · ') || '가수'; }
  function cover(p){
    var c = col(p), ch = esc(Array.from(p.n || '♪')[0] || '♪');
    return 'style="--c1:'+c[0]+';--c2:'+c[1]+'">' + ch + (p.i ? '<img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="'+esc(p.i)+'" onerror="this.remove()">' : '');
  }
  SG.forEach(function(p, i){ p._i = i; });

  /* ── 상태 ── */
  var curCat = 'all', query = '', pickSeed = 0, curIdx = -1, sideTab = 'same';

  function pool(){
    var q = query.trim().toLowerCase();
    return SG.filter(function(p){
      if (curCat !== 'all' && (p.c || []).indexOf(curCat) < 0) return false;
      return !q || (p.n || '').toLowerCase().indexOf(q) >= 0;
    });
  }
  function renderChips(){
    $('chips').innerHTML = CATS.map(function(c){
      var n = c[0] === 'all' ? SG.length : SG.filter(function(p){ return (p.c || []).indexOf(c[0]) >= 0; }).length;
      return '<button type="button" class="chip'+(c[0]===curCat?' on':'')+'" data-c="'+c[0]+'">'+esc(c[1])+'<span class="n">'+n+'</span></button>';
    }).join('');
  }
  function renderMoods(){
    $('moods').innerHTML = CATS.slice(1).map(function(c){
      var k = COL[c[0]] || COL.all, n = SG.filter(function(p){ return (p.c || []).indexOf(c[0]) >= 0; }).length;
      return '<button type="button" class="mood" data-c="'+c[0]+'" style="--c1:'+k[0]+';--c2:'+k[1]+'"><small>가수 '+n+'</small><b>'+esc(c[1])+'</b></button>';
    }).join('');
  }
  function renderHome(){
    var list = pool(), searching = !!query.trim();
    /* 빠른 선곡: 목록에서 12명 (버튼을 누를 때만 다른 가수로 바뀜) */
    var n = Math.min(12, list.length), picks = [];
    for (var k = 0; k < n; k++) picks.push(list[(pickSeed * 12 + k * Math.max(1, Math.floor(list.length / n))) % list.length]);
    picks = picks.filter(function(p, i){ return picks.indexOf(p) === i; });
    $('secPicks').style.display = (searching || !picks.length) ? 'none' : '';
    $('secMoods').style.display = (searching || curCat !== 'all') ? 'none' : '';
    $('pickEyebrow').textContent = curCat === 'all' ? '오늘은 이 가수 어때요' : CAT_NAME[curCat] + '에서 골랐어요';
    $('picks').innerHTML = picks.map(function(p){
      return '<button type="button" class="pick" data-i="'+p._i+'"><div class="cv" '+cover(p)+'</div><div class="t"><b>'+esc(p.n)+'</b><span>'+esc(catLabel(p))+'</span></div></button>';
    }).join('');
    $('gridEyebrow').textContent = searching ? '"' + query.trim() + '" 검색 결과' : (curCat === 'all' ? '전체' : CAT_NAME[curCat]);
    $('gridCount').textContent = list.length + '명';
    $('grid').innerHTML = list.length ? list.map(function(p){
      return '<button type="button" class="card" data-i="'+p._i+'"><div class="cv" '+cover(p)+'<div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div><b>'+esc(p.n)+'</b><span>'+esc(catLabel(p))+'</span></button>';
    }).join('') : '<div class="empty" style="grid-column:1/-1">찾는 가수가 없어요. 다른 이름으로 찾아 보세요.</div>';
  }
  function renderQueue(){
    var p = SG[curIdx]; if (!p) return;
    var list = sideTab === 'all' ? SG : SG.filter(function(x){ return (x.c || []).some(function(c){ return (p.c || []).indexOf(c) >= 0; }); });
    $('queue').innerHTML = list.map(function(x){
      return '<button type="button" class="q'+(x._i===curIdx?' on':'')+'" data-i="'+x._i+'"><div class="cv" '+cover(x)+'</div><div class="t"><b>'+esc(x.n)+'</b><span>'+esc(catLabel(x))+'</span></div><div class="eq"><i></i><i></i><i></i></div></button>';
    }).join('');
    var on = $('queue').querySelector('.q.on'); if (on) $('queue').scrollTop = Math.max(0, on.offsetTop - 120);
  }

  /* ── YouTube 재생 (플레이어 1개를 계속 재사용) ── */
  var player = null, ready = false, apiAsked = false, tick = null, shuffle = false, loop = false;
  function parse(u){
    var l = (u.match(/[?&]list=([^&#]+)/) || [])[1] || '', v = (u.match(/[?&]v=([^&#]+)/) || u.match(/youtu\.be\/([^?&#]+)/) || [])[1] || '';
    return { list: l, v: v };
  }
  function embedUrl(u){
    var k = parse(u), base = 'https://www.youtube.com/embed/' + (k.v || 'videoseries');
    var q = ['autoplay=1','playsinline=1','rel=0','enablejsapi=1'];
    if (k.list) q.push('list=' + encodeURIComponent(k.list));
    if (/^https?:/.test(location.protocol)) q.push('origin=' + encodeURIComponent(location.origin));
    return base + '?' + q.join('&');
  }
  function attachApi(){
    if (apiAsked) return; apiAsked = true;
    var prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function(){ if (prev) try { prev(); } catch(e){} bind(); };
    var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  }
  function bind(){
    if (player || !window.YT || !YT.Player || !$('ytFrame')) return;
    player = new YT.Player('ytFrame', { events: {
      onReady: function(){ ready = true; setCtl(true); },
      onStateChange: function(e){
        var playing = e.data === 1;
        document.body.classList.toggle('is-playing', playing);
        $('ppIcon').innerHTML = playing ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
        if (e.data === 1 || e.data === 5 || e.data === -1) showTitle();
        clearInterval(tick); if (playing) tick = setInterval(progress, 1000);
        progress();
      }
    }});
  }
  function setCtl(on){ ['shufTg','prevBtn','ppBtn','nextBtn','loopTg'].forEach(function(id){ $(id).disabled = !on; }); }
  function fmt(s){ s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function progress(){
    if (!ready) return;
    try { var d = player.getDuration() || 0, c = player.getCurrentTime() || 0;
      $('progFill').style.width = d ? (c / d * 100) + '%' : '0'; $('timeTxt').textContent = fmt(c) + ' / ' + fmt(d); } catch(e){}
  }
  function showTitle(){
    if (!ready) return;
    try { var d = player.getVideoData(); if (d && d.title){ $('barTitle').textContent = d.title; } } catch(e){}
  }
  function play(i){
    var p = SG[i]; if (!p || !p.u) return;
    curIdx = i;
    var c = col(p);
    $('glow').style.setProperty('--g1', c[0]); $('glow').style.setProperty('--g2', c[1]);
    $('metaCv').outerHTML = '<div class="cv" id="metaCv" ' + cover(p) + '</div>';
    $('metaName').textContent = p.n; $('metaSub').textContent = catLabel(p) + ' · 유튜브 재생목록';
    $('barCv').outerHTML = '<div class="cv" id="barCv" ' + cover(p) + '</div>';
    $('barTitle').textContent = p.n; $('barSub').textContent = p.n + ' · ' + catLabel(p);
    document.body.classList.add('playing-view'); $('main').scrollTop = 0;
    renderQueue();
    var k = parse(p.u);
    if (ready && player){
      try {
        if (k.list) player.loadPlaylist({ list: k.list, listType: 'playlist', index: 0 });
        else player.loadVideoById(k.v);
        return;
      } catch(e){}
    }
    if (!$('ytFrame')){
      $('stage').innerHTML = '<iframe id="ytFrame" title="재생 화면" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen src="' + esc(embedUrl(p.u)) + '"></iframe>';

  /* ── 이벤트 ── */
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-i]'); if (t){ play(+t.dataset.i); return; }
    var c = e.target.closest('.chip,.mood');

/* 복사 방지 */
(function(){
  ['contextmenu','selectstart','dragstart','copy','cut'].forEach(function(ev){
    document.addEventListener(ev, function(e){ var t = e.target; if (t && t.closest && t.closest('input,textarea')) return; e.preventDefault(); }, true);
  });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase(), c = e.ctrlKey || e.metaKey, inField = e.target && e.target.closest && e.target.closest('input,textarea');
    if (e.key === 'F12' || (c && ['u','s'].indexOf(k) > -1) || (c && !inField && ['c','x','a'].indexOf(k) > -1) || (c && e.shiftKey && ['i','j','c'].indexOf(k) > -1)){ e.preventDefault(); e.stopPropagation(); }
  }, true);
})();
