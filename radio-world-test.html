<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>해외 라디오 후보 테스트 | MYWAY.KR</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:#f7f3eb;color:#1f2740;font-family:"Pretendard",-apple-system,sans-serif;font-size:12.5px;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 14px 120px}
  h1{font-size:18px;font-weight:800;letter-spacing:-.3px;margin:0 0 6px}
  .lead{color:#6b7190;margin:0 0 6px;line-height:1.6}
  .part{font-size:15.5px;font-weight:800;margin:30px 0 4px;padding-top:18px;border-top:2px solid #e2ddd0}
  .part small{display:block;font-size:12px;font-weight:500;color:#8a8f99;margin-top:4px;line-height:1.5}
  h2{font-size:13.5px;font-weight:800;color:#5b4bdb;margin:18px 4px 9px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .card{background:#fff;border:1px solid #e6e2d8;border-radius:12px;padding:11px 12px;box-shadow:0 2px 6px rgba(90,90,130,.07)}
  .no{display:inline-block;min-width:30px;text-align:center;font-weight:800;color:#fff;background:#8a80dc;border-radius:6px;padding:2px 6px;margin-right:6px;font-size:12px}
  .t{font-size:13.5px;font-weight:800;letter-spacing:-.2px}
  .d{color:#8a8f99;margin:4px 0 8px;line-height:1.4}
  .card iframe{display:block;width:100%;height:100px;border:0;border-radius:8px;background:#f1f1f4}
  .sbtn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid #dcdfee;border-radius:10px;padding:11px 12px;font-family:inherit;font-size:13px;font-weight:700;color:#5d6388;cursor:pointer;background:linear-gradient(135deg,#fff,#f4f5fc 50%,#eceafa)}
  .card.on{border-color:#8a80dc;box-shadow:0 0 0 2px rgba(138,128,220,.35)}
  .card.on .sbtn{color:#fff;border-color:transparent;background:linear-gradient(135deg,#6fb3d8,#8a80dc 50%,#a98be3)}
  .st{margin-top:7px;font-weight:700;color:#8a8f99;min-height:16px}
  .st.ok{color:#1c8a5a} .st.bad{color:#d14848}
  .myway-footer{text-align:center;color:#8a8f99;padding:30px 0 0}
  .myway-footer a{color:#6a5fd0;font-weight:700;text-decoration:none}
  .home-fab{position:fixed;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#6fb3d8,#8a80dc 50%,#a98be3);box-shadow:0 6px 16px rgba(90,100,180,.35);z-index:50}
  .home-fab svg{width:21px;height:21px}
  @media (max-width:720px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <h1>해외 라디오 후보 테스트</h1>
  <p class="lead">하나씩 눌러 보고 <b>소리가 실제로 나오는 번호</b>만 알려 주세요. (예: "T1, T7, S2, S5 됨")</p>

  <div class="part">① TuneIn 플레이어 방식 (T번호)<small>카드 안의 ▶ 를 누르세요. 안내창이 덮거나 "잘못된 URL"이 나오면 안 되는 방송이에요.</small></div>
  <div id="tList"></div>

  <div class="part">② 방송사 스트림 직접 재생 방식 (S번호)<small>버튼을 누르면 마이웨이 플레이어로 재생돼요. 다른 버튼을 누르면 이전 방송은 멈춥니다. 5초쯤 기다려도 "재생 중"이 안 되면 안 되는 방송이에요.</small></div>
  <div id="sList"></div>

  <footer class="myway-footer"><a href="https://myway.kr">MYWAY.KR</a></footer>
</div>
<audio id="au" preload="none"></audio>
<a class="home-fab" href="https://myway.kr" aria-label="MYWAY.KR 홈" title="MYWAY.KR 홈">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/></svg>
</a>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ① TuneIn 후보: [국가, 이름, 설명, 채널번호] */
var TUNEIN = [
  ['🇺🇸 미국', 'KCRW News', 'LA 공영 라디오 뉴스', 's44525'],
  ['🇺🇸 미국', 'Jazz24', '24시간 재즈', 's34682'],
  ['🇺🇸 미국', 'KCRW 본방송', 'LA 공영 라디오', 's19778'],
  ['🇺🇸 미국', 'WQXR', '뉴욕 클래식', 's29288'],
  ['🇬🇧 영국', 'BBC Radio 2', '영국 청취율 1위 · 팝', 's24940'],
  ['🇬🇧 영국', 'BBC Radio 6 Music', '얼터너티브 음악', 's44491'],
  ['🇬🇧 영국', 'talkSPORT', '스포츠 토크', 's17077'],
  ['🇬🇧 영국', 'LBC London', '뉴스·토크', 's2459'],
  ['🇯🇵 일본', 'Shonan Beach FM', '재즈/올드팝', 's8138'],
  ['🇯🇵 일본', 'J-Idols Project Radio', 'J-Pop 인터넷 라디오', 's257977']
];
/* ② 직접 스트림 후보: [국가, 이름, 설명, 주소] */
var STREAMS = [
  ['🇺🇸 미국', 'NPR 뉴스', 'NPR 24시간 프로그램', 'https://npr-ice.streamguys1.com/live.mp3'],
  ['🇺🇸 미국', 'WNYC 뉴욕', '공영 라디오 뉴스/토크', 'https://fm939.wnyc.org/wnycfm'],
  ['🇺🇸 미국', 'KEXP 시애틀', '인디·얼터너티브', 'https://kexp-mp3-128.streamguys1.com/kexp128.mp3'],
  ['🇺🇸 미국', 'WQXR 뉴욕', '클래식', 'https://stream.wqxr.org/wqxr'],
  ['🇺🇸 미국', 'KCRW Eclectic24', '음악 전문 채널', 'https://streams.kcrw.com/e24_mp3'],
  ['🇬🇧 영국', 'BBC World Service', '24시간 영어 뉴스', 'https://stream.live.vc.bbcmedia.co.uk/bbc_world_service'],
  ['🇬🇧 영국', 'BBC Radio 4', '뉴스·토크·드라마', 'https://as-hls-ww-live.akamaized.net/pool_55057080/live/ww/bbc_radio_fourfm/bbc_radio_fourfm.isml/bbc_radio_fourfm-audio%3d96000.norewind.m3u8'],
  ['🇬🇧 영국', 'BBC Radio 2', '팝', 'https://as-hls-ww-live.akamaized.net/pool_74208725/live/ww/bbc_radio_two/bbc_radio_two.isml/bbc_radio_two-audio%3d96000.norewind.m3u8'],
  ['🇬🇧 영국', 'Classic FM', '클래식', 'https://media-ice.musicradio.com/ClassicFMMP3'],
  ['🇬🇧 영국', 'LBC', '뉴스·토크', 'https://media-ice.musicradio.com/LBCUKMP3'],
  ['🇯🇵 일본', 'NHK WORLD-JAPAN 라디오', '국제 방송(영어 등)', 'https://nhkworld.webcdn.stream.ne.jp/www11/radiojapan/all/263941/live.m3u8'],
  ['🇯🇵 일본', 'Shonan Beach FM', '재즈/올드팝', 'https://shonanbeachfm.out.airtime.pro/shonanbeachfm_a']
];

function group(list, prefix, cardFn){
  var html = '', last = '';
  list.forEach(function(s, i){
    if (s[0] !== last) { html += (last ? '</div>' : '') + '<h2>' + esc(s[0]) + '</h2><div class="grid">'; last = s[0]; }
    html += cardFn(s, i, prefix + (i + 1));
  });
  return html + '</div>';
}
document.getElementById('tList').innerHTML = group(TUNEIN, 'T', function(s, i, no){
  return '<div class="card"><div><span class="no">' + no + '</span><span class="t">' + esc(s[1]) + '</span></div><div class="d">' + esc(s[2]) + '</div>' +
    '<iframe title="' + esc(s[1]) + '" scrolling="no" allow="autoplay; encrypted-media" src="https://tunein.com/embed/player/' + s[3] + '/"></iframe></div>';
});
document.getElementById('sList').innerHTML = group(STREAMS, 'S', function(s, i, no){
  return '<div class="card" data-i="' + i + '"><button type="button" class="sbtn"><span class="no">' + no + '</span><span>▶ ' + esc(s[1]) + '</span></button>' +
    '<div class="d" style="margin-bottom:0">' + esc(s[2]) + '</div><div class="st"></div></div>';
});

/* 직접 스트림: 오디오는 1개만 → 다른 방송을 누르면 이전 방송은 자동으로 멈춤 */
var au = document.getElementById('au'), hls = null, cur = -1;
function setSt(i, txt, cls){ var c = document.querySelector('#sList .card[data-i="' + i + '"] .st'); if (c) { c.textContent = txt; c.className = 'st' + (cls ? ' ' + cls : ''); } }
function stopAll(){
  if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
  try { au.pause(); au.removeAttribute('src'); au.load(); } catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll('#sList .card'), function(c){ c.classList.remove('on'); });
}
function playS(i){
  var same = (i === cur);
  if (cur >= 0) setSt(cur, '');
  stopAll(); cur = -1;
  if (same) return;                       /* 재생 중인 버튼을 다시 누르면 정지 */
  cur = i;
  var url = STREAMS[i][3];
  document.querySelector('#sList .card[data-i="' + i + '"]').classList.add('on');
  setSt(i, '연결 중…');
  if (/\.m3u8/.test(url) && !au.canPlayType('application/vnd.apple.mpegurl') && window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.on(Hls.Events.ERROR, function(ev, d){ if (d && d.fatal && cur === i) setSt(i, '✕ 안 나옴', 'bad'); });
    hls.loadSource(url); hls.attachMedia(au);
  } else { au.src = url; }
  var p = au.play(); if (p && p.catch) p.catch(function(){ if (cur === i) setSt(i, '✕ 안 나옴', 'bad'); });
}
au.addEventListener('playing', function(){ if (cur >= 0) setSt(cur, '♪ 재생 중 — 소리가 들리면 OK', 'ok'); });
au.addEventListener('error', function(){ if (cur >= 0) setSt(cur, '✕ 안 나옴', 'bad'); });
document.getElementById('sList').addEventListener('click', function(e){ var c = e.target.closest('.card'); if (c) playS(+c.getAttribute('data-i')); });

/* 복사 방지 */
['contextmenu','selectstart','dragstart','copy','cut'].forEach(function(ev){ document.addEventListener(ev, function(e){ e.preventDefault(); }); });
document.addEventListener('keydown', function(e){
  var k = (e.key||'').toLowerCase();
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && /^[ijc]$/.test(k)) || (e.ctrlKey && !e.shiftKey && /^[uscxa]$/.test(k))) e.preventDefault();
});
</script>
</body>
</html>
