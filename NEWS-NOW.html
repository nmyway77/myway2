<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>최신 뉴스 - MYWAY</title>
<style>
  :root { --line:#e6e9f0; --sub:#7a8199; --ink:#1f2740; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); background:#f6f7fb; -webkit-user-select:none; user-select:none; }
  input { -webkit-user-select:text; user-select:text; }
  .wrap { max-width:1180px; margin:0 auto; padding:18px 16px 30px; }
  .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .top h1 { margin:0 8px 0 0; font-size:19px; font-weight:900; letter-spacing:-.4px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1.5px solid #dfe3ec; background:#fff; border-radius:999px; padding:6px 13px; font:inherit; font-size:13px; font-weight:700; color:#4a5170; cursor:pointer; white-space:nowrap; }
  .chip.on { background:#1f2740; color:#fff; border-color:#1f2740; }
  .chip.time.on { background:linear-gradient(95deg,#5b8def,#b176f3); border-color:transparent; }
  .find { flex:1; min-width:180px; max-width:340px; height:34px; border:1.5px solid #dfe3ec; border-radius:999px; padding:0 14px; font:inherit; font-size:13.5px; outline:none; background:#fff; }
  .find:focus { border-color:#8f9fe8; }
  .go { border:0; border-radius:999px; padding:8px 16px; font:inherit; font-size:13px; font-weight:800; color:#fff; background:linear-gradient(95deg,#7ed6fb 10%,#b176f3 90%); cursor:pointer; }
  .st { font-size:12.5px; color:var(--sub); margin:6px 2px 14px; }
  .cats { margin-bottom:6px; }
  /* 빙 뉴스처럼: 사진 기사 카드 + 사진 없는 기사 목록 */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px; }
  .card { display:block; text-decoration:none; color:inherit; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 10px rgba(20,30,60,.07); transition:transform .18s, box-shadow .18s; }
  .card:hover { transform:translateY(-3px); box-shadow:0 10px 22px rgba(20,30,60,.12); }
  .card .ph { position:relative; aspect-ratio:16/9; background:#e9ecf3; overflow:hidden; }
  .card .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .card .tx { padding:10px 12px 12px; }
  .card b { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; font-size:14.5px; line-height:1.4; letter-spacing:-.2px; }
  .card.np b { -webkit-line-clamp:4; font-size:15px; }
  .card.np .tx { padding:14px 14px 14px; border-top:4px solid var(--c, #8f9fe8); }
  .meta { display:flex; align-items:center; gap:6px; margin-top:7px; font-size:12px; color:var(--sub); flex-wrap:wrap; }
  .src { font-weight:800; color:#3b4566; }
  .new { background:#ff4d5e; color:#fff; font-size:10.5px; font-weight:800; padding:1px 6px; border-radius:999px; }
  .more { color:#5b6bd6; font-weight:700; }
  .empty { padding:50px 0; text-align:center; color:var(--sub); }
  footer { text-align:center; padding:18px 0 26px; border-top:1px solid var(--line); margin-top:26px; }
  .home { display:inline-flex; width:46px; height:46px; border-radius:50%; align-items:center; justify-content:center; background:linear-gradient(135deg,#7ed6fb,#b176f3); box-shadow:0 6px 16px rgba(120,100,240,.3); }
  .home svg { width:22px; height:22px; fill:#fff; }
  footer p { margin:10px 0 0; font-size:13px; color:var(--sub); } footer p a { font-weight:800; color:var(--ink); text-decoration:none; }
  .homefix { position:fixed; right:16px; bottom:16px; z-index:50; }
  @media (max-width:600px){ .wrap { padding:12px 10px 24px; } .grid { grid-template-columns:repeat(2, minmax(0,1fr)); gap:9px; } .card b { font-size:13px; } .card.np b { font-size:13.5px; } .top h1 { font-size:17px; } .find { max-width:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>📰 최신 뉴스</h1>
    <div class="chips" id="times"></div>
    <input class="find" id="find" type="search" placeholder="뉴스 검색 (예: 환율, 날씨)" autocomplete="off">
    <button type="button" class="go" id="go">↻ 불러오기</button>
  </div>
  <div class="chips cats" id="cats"></div>
  <div class="st" id="st"></div>
  <div class="grid" id="grid"></div>
  <footer>
    <a class="home" href="https://myway.kr/" target="_top" title="MYWAY 홈"><svg viewBox="0 0 24 24"><path d="M12 3.2 2.5 11.4l1.3 1.5L5 11.85V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-8.15l1.2 1.05 1.3-1.5L12 3.2Z"/></svg></a>
    <p><a href="https://myway.kr/" target="_top">myway.kr</a> · © MYWAY.KR</p>
  </footer>
</div>
<script>
/* 언론사 RSS(사진 있는 곳 위주) + 구글 뉴스 검색(when:N시간)을 모아서, 같은 기사는 하나로 합쳐 최신순으로 */
const OUTLETS = [
  ["연합뉴스", "https://www.yna.co.kr/rss/news.xml"],
  ["SBS", "https://news.sbs.co.kr/news/newsflashRssFeed.do?plink=RSSREADER"],
  ["MBC", "https://imnews.imbc.com/rss/google_news/narrativeNews.rss"],
  ["JTBC", "https://news-ex.jtbc.co.kr/v1/get/rss/newsflesh"],
  ["조선일보", "https://www.chosun.com/arc/outboundfeeds/rss/?outputType=xml"],
  ["동아일보", "https://rss.donga.com/total.xml"],
  ["매일경제", "https://www.mk.co.kr/rss/30000001/"],
  ["세계일보", "https://www.segye.com/Articles/RSSList/segye_recent.xml"],
  ["국민일보", "https://www.kmib.co.kr/rss/data/kmibRssAll.xml"],
  ["오마이뉴스", "http://rss.ohmynews.com/rss/ohmynews.xml"],
  ["노컷뉴스", "https://rss.nocutnews.co.kr/nocutnews.xml"],
  ["머니투데이", "https://rss.mt.co.kr/mt_news.xml"],
  ["한국경제", "https://www.hankyung.com/feed/all-news"],
  ["경향신문", "https://www.khan.co.kr/rss/rssdata/total_news.xml"],
  ["뉴시스", "https://newsis.com/RSS/sokbo.xml"]
];
const CATS = [["전체", ["속보", "뉴스", "정부", "경제", "사회", "국제"]], ["정치", ["정치", "국회", "대통령실"]], ["경제", ["경제", "증시", "부동산"]], ["사회", ["사회", "사건", "날씨"]],
  ["국제", ["국제", "미국", "중국 일본"]], ["IT·과학", ["IT", "과학", "AI"]], ["연예", ["연예", "드라마", "가수"]], ["스포츠", ["스포츠", "야구", "축구"]]];
const TIMES = [[1, "1시간"], [3, "3시간"], [6, "6시간"], [24, "24시간"]];
const COLS = ["#5b8def", "#ff6a88", "#2aa198", "#f08a3c", "#7b5cf0", "#e0784a", "#3b8fd9", "#c46be0"];
let hours = 3, cat = 0, loading = false, ITEMS = [];
const $ = id => document.getElementById(id);
const ta = document.createElement("textarea"); const unesc = s => { ta.innerHTML = String(s || ""); return ta.value; };
const ago = d => { const m = Math.floor((Date.now() - d) / 60000); if (m < 1) return "방금"; if (m < 60) return m + "분 전"; const h = Math.floor(m / 60); if (h < 24) return h + "시간 전"; return Math.floor(h / 24) + "일 전"; };

/* 복제방지 */
(function(){
  const ok = t => t && (/^(input|textarea)$/i.test(t.tagName) || t.isContentEditable);
  ['contextmenu','dragstart','selectstart','copy','cut'].forEach(ev => document.addEventListener(ev, e => { if (!ok(e.target)) e.preventDefault(); }, true));
  document.addEventListener('keydown', e => { if (ok(e.target)) return; const k = (e.key || '').toLowerCase(); if (k === 'f12' || (e.ctrlKey && e.shiftKey && 'ijc'.includes(k)) || (e.ctrlKey && !e.shiftKey && 'uscxa'.includes(k) && k)) e.preventDefault(); }, true);
})();

function chips(){
  $("times").innerHTML = TIMES.map(t => `<button type="button" class="chip time${t[0] === hours ? " on" : ""}" data-h="${t[0]}">${t[1]}</button>`).join("");
  $("cats").innerHTML = CATS.map((c, i) => `<button type="button" class="chip${i === cat ? " on" : ""}" data-c="${i}">${c[0]}</button>`).join("");
}
$("times").onclick = e => { const b = e.target.closest("[data-h]"); if (!b) return; hours = +b.dataset.h; chips(); load(); };
$("cats").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; cat = +b.dataset.c; chips(); load(); };
$("go").onclick = () => load();
$("find").addEventListener("keydown", e => { if (e.key === "Enter") load(); });

function rss(url){
  return fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url)).then(r => r.json()).then(j => j.status === "ok" ? (j.items || []) : []).catch(() => []);
}
function imgOf(i){
  let u = i.thumbnail || (i.enclosure && (i.enclosure.link || i.enclosure.url)) || "";
  if (!u) { const m = String(i.description || i.content || "").match(/<img[^>]+src=["']([^"']+)/i); if (m) u = m[1]; }
  return /^https?:\/\//.test(u) && !/\.(mp4|mp3)(\?|$)/i.test(u) ? u : "";
}
/* 제목을 글자 2개씩 묶어 비교 → 겹치는 비율이 높으면 같은 기사로 봄 */
function norm(s){ return String(s).replace(/\[[^\]]*\]|\([^)]*\)|【[^】]*】|<[^>]*>/g, " ").replace(/[^\p{L}\p{N}]/gu, ""); }
function grams(s){ const g = new Set(); for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2)); return g; }
function same(a, b){ if (!a.size || !b.size) return false; let n = 0; a.forEach(x => { if (b.has(x)) n++; }); return n / Math.min(a.size, b.size) >= 0.6; }

function load(){
  if (loading) return; loading = true;
  const q = $("find").value.trim();
  const words = q ? [q] : CATS[cat][1];
  const gnews = words.map(w => "https://news.google.com/rss/search?q=" + encodeURIComponent(w + " when:" + hours + "h") + "&hl=ko&gl=KR&ceid=KR:ko");
  const jobs = gnews.map(u => ({ u, g: true })).concat((q || cat) ? [] : OUTLETS.map(o => ({ u: o[1], name: o[0] })));
  $("st").textContent = "불러오는 중… 0/" + jobs.length; $("grid").innerHTML = "";
  const out = []; let k = 0, done = 0;
  const worker = () => { if (k >= jobs.length) return Promise.resolve(); const j = jobs[k++];
    return rss(j.u).then(items => {
      items.forEach(i => {
        let t = unesc(i.title), src = j.name || "";
        if (j.g) { const m = t.match(/^(.*)\s-\s([^-]+)$/); if (m) { t = m[1]; src = m[2].trim(); } }
        const d = Date.parse(String(i.pubDate || "").replace(" ", "T") + "Z"); if (isNaN(d)) return;
        if (q && !j.g && t.indexOf(q) < 0) return;
        out.push({ t: t.trim(), src, d, link: i.link, img: j.g ? "" : imgOf(i) });
      });
      done++; $("st").textContent = "불러오는 중… " + done + "/" + jobs.length;
      return worker();
    }); };
  Promise.all([worker(), worker(), worker(), worker()]).then(() => {
    const lim = Date.now() - hours * 3600000;
    const list = out.filter(x => x.d >= lim && x.d <= Date.now() + 600000).sort((a, b) => b.d - a.d);
    /* 같은 기사 합치기: 사진 있는 쪽을 대표로, 나머지는 '외 N곳' */
    const merged = [];
    list.forEach(x => { x.g = grams(norm(x.t)); const hit = merged.find(m => same(m.g, x.g));
      if (hit) { if (!hit.srcs.includes(x.src)) hit.srcs.push(x.src); if (!hit.img && x.img) { hit.img = x.img; } }
      else merged.push(Object.assign(x, { srcs: [x.src] })); });
    ITEMS = merged; loading = false; render(out.length);
  });
}
function render(raw){
  const g = $("grid"); g.innerHTML = "";
  $("st").textContent = ITEMS.length ? `최근 ${hours}시간 · ${ITEMS.length}개 (같은 기사 ${raw - ITEMS.length}개는 하나로 합침) · 누르면 기사 새 창` : "";
  if (!ITEMS.length) { g.innerHTML = `<div class="empty">이 시간 안에 올라온 뉴스가 없어요 — 시간을 늘려 보세요</div>`; return; }
  ITEMS.forEach((x, i) => {
    const a = document.createElement("a"); a.className = "card" + (x.img ? "" : " np"); a.href = x.link; a.target = "_blank"; a.rel = "noopener";
    a.style.setProperty("--c", COLS[i % COLS.length]);
    a.innerHTML = (x.img ? `<div class="ph"><img loading="lazy" referrerpolicy="no-referrer" alt=""></div>` : "") + `<div class="tx"><b></b><div class="meta"></div></div>`;
    if (x.img) { const im = a.querySelector("img"); im.src = x.img; im.onerror = () => { a.querySelector(".ph").remove(); a.classList.add("np"); }; }
    a.querySelector("b").textContent = x.t;
    const fresh = Date.now() - x.d < 3600000;
    a.querySelector(".meta").innerHTML = (fresh ? `<span class="new">NEW</span>` : "") + `<span class="src"></span><span>· ${ago(x.d)}</span>` + (x.srcs.length > 1 ? `<span class="more">외 ${x.srcs.length - 1}곳</span>` : "");
    a.querySelector(".src").textContent = x.srcs[0] || "뉴스";
    g.appendChild(a);
  });
}
chips(); load();
</script>
<script>
/* 핸드폰: 기사를 같은 창(최상위)에서 열어 뒤로가기로 MYWAY 복귀 */
(function(){
  if (!/Mobi/i.test(navigator.userAgent)) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest ? e.target.closest("a.card") : null; if (!a) return;
    e.preventDefault(); try { (window.top || window).location.href = a.href; } catch(_) { window.open(a.href, "_blank"); }
  }, true);
})();
</script>
</body>
</html>
