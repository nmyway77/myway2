<style>
  :root { --line:#e6e9f0; --sub:#7a8199; --ink:#1f2740; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); background:#f6f7fb; -webkit-user-select:none; user-select:none; }
  a { color:inherit; }
  .wrap { max-width:1120px; margin:0 auto; padding:20px 16px 30px; }
  h2 { margin:0 0 12px; font-size:16px; font-weight:800; letter-spacing:-.3px; }
  h2 small { font-size:12px; color:var(--sub); font-weight:500; margin-left:8px; }

  /* 상단: 영화관·영화 사이트 */
  .th-row { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:10px; margin-bottom:10px; }
  .th-row.ott-row { grid-template-columns:repeat(8, minmax(0,1fr)); margin-bottom:28px; }
  .th { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; height:104px; border-radius:16px; background:#fff; text-decoration:none; box-shadow:0 2px 10px rgba(20,30,60,.06); border:1px solid var(--line); transition:transform .18s, box-shadow .18s; overflow:hidden; }
  .th:hover { transform:translateY(-3px); box-shadow:0 10px 22px rgba(20,30,60,.12); }
  .th .lg { width:54px; height:54px; border-radius:14px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:var(--c); color:#fff; font-weight:900; font-size:20px; letter-spacing:-.5px; }
  .th .lg img { width:100%; height:100%; object-fit:cover; display:block; }
  .th b { font-size:13px; font-weight:800; }
  .th::after { content:"↗"; position:absolute; right:9px; top:7px; font-size:11px; color:#b3b9cc; }

  /* 채널 카드 */
  .ch-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:12px; margin-bottom:26px; }
  .ch { position:relative; aspect-ratio:1/1; border-radius:14px; overflow:hidden; cursor:pointer; background:linear-gradient(150deg,var(--c1),var(--c2)); box-shadow:0 2px 10px rgba(20,30,60,.08); transition:transform .18s, box-shadow .18s; }
  .ch:hover { transform:translateY(-3px); box-shadow:0 12px 24px rgba(20,30,60,.16); }
  .ch img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ch .nm { position:absolute; left:0; right:0; bottom:0; padding:26px 10px 9px; color:#fff; background:linear-gradient(180deg,transparent,rgba(0,0,0,.72)); }
  .ch .nm b { display:block; font-size:14px; font-weight:800; }
  .ch .nm i { font-style:normal; font-size:11px; opacity:.85; }
  .ch .big { position:absolute; inset:0 0 40px; display:flex; align-items:center; justify-content:center; padding:10px; color:#fff; font-size:21px; font-weight:900; text-align:center; word-break:keep-all; text-shadow:0 2px 10px rgba(0,0,0,.2); }
  .ch .pl { position:absolute; right:9px; top:9px; width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,.45); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; opacity:0; transition:opacity .2s; }
  .ch:hover .pl { opacity:1; }
  .ch .ex { position:absolute; left:8px; top:8px; font-size:10.5px; font-weight:800; color:#fff; background:rgba(0,0,0,.45); padding:2px 8px; border-radius:999px; }

  /* 재생 화면 */
  .play { position:fixed; inset:0; display:none; flex-direction:column; background:#fff; z-index:20; }
  body.playing .play { display:flex; }
  body.playing .list-view { display:none; }
  .bar { flex:none; display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); }
  .back { flex:none; border:0; border-radius:999px; padding:7px 14px; font-size:13px; font-weight:800; color:#fff; background:linear-gradient(95deg,#7ed6fb 10%,#b176f3 90%); cursor:pointer; }
  .ttl { flex:1; min-width:0; font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ttl small { font-size:12px; color:var(--sub); font-weight:500; margin-left:6px; }
  .yt { flex:none; font-size:12px; font-weight:700; color:#c00; text-decoration:none; border:1.5px solid #f1c4c4; border-radius:999px; padding:5px 11px; }
  .body { flex:1; min-height:0; display:flex; }
  .main { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; background:#000; }
  .v { position:relative; width:100%; max-height:100%; aspect-ratio:16/9; }
  .v iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .side { flex:none; width:340px; display:flex; flex-direction:column; border-left:1px solid var(--line); min-height:0; }
  .head { flex:none; padding:9px 12px; font-size:13px; font-weight:800; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  .head span { color:var(--sub); font-weight:600; }
  .items { flex:1; overflow-y:auto; padding:6px; }
  .it { display:flex; align-items:center; gap:8px; padding:6px; border-radius:8px; cursor:pointer; }
  .it:hover { background:#f4f6fb; }
  .it.cur { background:#fde8eb; }
  .it .no { flex:none; width:24px; text-align:center; font-size:11.5px; color:var(--sub); font-weight:700; }
  .it img { flex:none; width:100px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; background:#eee; }
  .it .ti { flex:1; min-width:0; font-size:12.5px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  footer { text-align:center; padding:18px 0 26px; border-top:1px solid var(--line); }
  .home { display:inline-flex; width:46px; height:46px; border-radius:50%; align-items:center; justify-content:center; background:linear-gradient(135deg,#7ed6fb,#b176f3); box-shadow:0 6px 16px rgba(120,100,240,.3); }
  .home svg { width:22px; height:22px; fill:#fff; }
  footer p { margin:10px 0 0; font-size:13px; color:var(--sub); }
  footer p a { font-weight:800; color:var(--ink); text-decoration:none; }

  @media (max-width:900px) { .th-row, .th-row.ott-row { grid-template-columns:repeat(4, minmax(0,1fr)); } }
  @media (max-width:720px) {
    .wrap { padding:14px 10px 24px; }
    .th-row, .th-row.ott-row { grid-template-columns:repeat(4, minmax(0,1fr)); gap:7px; }
    .th { height:86px; border-radius:12px; } .th .lg { width:42px; height:42px; border-radius:11px; font-size:12px; } .th b { font-size:11.5px; }
    .ch-grid { grid-template-columns:repeat(2, minmax(0,1fr)); gap:9px; }
    .body { flex-direction:column; } .main { flex:none; } .side { width:auto; flex:1; border-left:0; border-top:1px solid var(--line); }
    .bar { flex-wrap:wrap; } .ttl { order:3; flex-basis:100%; }
  }
  /* 🔔 새 영상 */
  .feed-btn { margin-left:10px; vertical-align:middle; border:1.5px solid #b9cdf5; background:#eef4ff; color:#2a4fa8; border-radius:999px; padding:5px 12px; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer; }
  .feed-btn:hover { background:#dfe9ff; }
  .fd-head { display:flex; align-items:center; gap:10px; margin:0 0 12px; }
  .fd-back { border:0; border-radius:999px; padding:7px 14px; font:inherit; font-size:13px; font-weight:800; color:#fff; background:linear-gradient(95deg,#7ed6fb 10%,#b176f3 90%); cursor:pointer; }
  .fd-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 14px; } .fd-top .lb { font-size:13px; color:#7a8199; margin-right:4px; }
  .fd-chip { border:1.5px solid #dfe3ec; background:#fff; border-radius:999px; padding:6px 13px; font:inherit; font-size:13px; font-weight:700; color:#4a5170; cursor:pointer; } .fd-chip.on { background:#1f2740; color:#fff; border-color:#1f2740; }
  .fd-st { font-size:13px; color:#7a8199; margin-left:auto; }
  .fd-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; }
  .fd-it { cursor:pointer; border-radius:12px; overflow:hidden; background:#fff; box-shadow:0 2px 10px rgba(20,30,60,.07); transition:transform .18s; } .fd-it:hover { transform:translateY(-3px); }
  .fd-it img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#eee; }
  .fd-it .tx { padding:8px 10px 10px; } .fd-it b { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:13.5px; line-height:1.35; color:#1f2740; }
  .fd-it small { display:block; margin-top:5px; font-size:12px; color:#7a8199; } .fd-empty { padding:40px 0; text-align:center; color:#7a8199; }
  @media (max-width:600px){ .fd-grid { grid-template-columns:repeat(2, minmax(0,1fr)); gap:9px; } .fd-it b { font-size:12.5px; } }
  /* ⛶ 크게 보기 */
  .big-btn { flex:none; border:1.5px solid #dfe3ec; background:#fff; color:#1f2740; border-radius:999px; padding:6px 12px; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer; white-space:nowrap; }
  :fullscreen.bigable, :-webkit-full-screen.bigable { background:#000 !important; display:flex !important; align-items:center; justify-content:center; width:100vw; height:100vh; }
  .bigable.big-fill { position:fixed !important; inset:0 !important; z-index:9999 !important; background:#000 !important; display:flex !important; align-items:center; justify-content:center; }
  .big-x { position:absolute; top:10px; right:10px; z-index:2; border:0; color:#fff; background:rgba(0,0,0,.6); padding:7px 13px; border-radius:999px; font:inherit; font-size:13px; font-weight:800; cursor:pointer; }
  :fullscreen.bigable > :not(.big-x), .bigable.big-fill > :not(.big-x) { max-height:100%; width:100%; }
</style>

function makeFeed(opt){

  function render(st){

    box.querySelectorAll(".fd-chip[data-d]").forEach(b => b.onclick = () => { days = +b.dataset.d; render(); });
    box.querySelector(".fd-re").onclick = () => { FEED = null; load(); };
    const g = box.querySelector(".fd-grid");
    if (FEED && !list.length) { g.outerHTML = `<div class="fd-empty">이 기간에 올라온 새 영상이 없어요</div>`; return; }

      it.querySelector("b").textContent = x.t; it.querySelector("small").textContent = x.ch + " · " + ago(x.d);
      it.onclick = () => opt.onPick(list, k); g.appendChild(it);

      .then(r => r.json()).then(j => {

    events: {
      onReady: e => { try { e.target.mute(); e.target.loadPlaylist(vids.map(x => x.v), start || 0); } catch(err) {} },
      onError: () => { try { const i = player.getPlaylistIndex(); if (i + 1 < vids.length) player.playVideoAt(i + 1); } catch(e) {} },
      onStateChange: e => { if (e.data === 1 && !started) { started = true; try { player.unMute(); player.setVolume(80); } catch(err) {} } highlight(); }
    }
  });
}
</script>
</body>
</html>
