<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KBS 라디오 직접 재생 테스트 | MYWAY.KR</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:#f7f3eb;color:#1f2740;font-family:"Pretendard",-apple-system,sans-serif;font-size:12.5px;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  .wrap{max-width:820px;margin:0 auto;padding:22px 14px 110px}
  h1{font-size:18px;font-weight:800;letter-spacing:-.3px;margin:0 0 6px}
  .lead{color:#6b7190;margin:0 0 16px;line-height:1.6}
  .screen{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#14151f;margin-bottom:14px;display:flex;align-items:center;justify-content:center;color:#9aa0b4;font-weight:700;text-align:center;line-height:1.6}
  .screen video{position:absolute;inset:0;width:100%;height:100%;background:#000;display:none}
  .screen.video video{display:block}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .card{display:block;width:100%;text-align:left;font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;background:#fff;border:1px solid #e6e2d8;border-radius:14px;padding:8px 8px 10px;box-shadow:0 4px 12px rgba(90,90,130,.08)}
  .card.on{border-color:#8a80dc;box-shadow:0 0 0 2px rgba(138,128,220,.4)}
  .art{aspect-ratio:1/1;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;text-align:center;padding:0 6px;line-height:1.25}
  .name{font-size:13px;font-weight:800;margin:8px 2px 2px}
  .st{margin:4px 2px 0;font-weight:700;min-height:15px;color:#8a8f99;font-size:11.5px;line-height:1.4}
  .st.ok{color:#5b4bdb} .st.bad{color:#d14848}
  .log{margin-top:16px;background:#fff;border:1px solid #e6e2d8;border-radius:12px;padding:12px;color:#6b7190;line-height:1.6;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text;min-height:60px}
  .myway-footer{text-align:center;color:#8a8f99;padding:26px 0 0}
  .myway-footer a{color:#6a5fd0;font-weight:700;text-decoration:none}
  .home-fab{position:fixed;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#6fb3d8,#8a80dc 50%,#a98be3);box-shadow:0 6px 16px rgba(90,100,180,.35);z-index:50}
  .home-fab svg{width:21px;height:21px}
  @media (max-width:620px){ .grid{grid-template-columns:repeat(3,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <h1>KBS 라디오 직접 재생 테스트</h1>
  <p class="lead">카드를 눌러 소리가 나오는지, <b>보이는 라디오</b>를 하는 방송은 위 화면에 영상이 나오는지 확인해 주세요.<br>안 되면 아래 <b>진행 기록</b>에 나온 글을 그대로 알려 주세요(캡처도 좋아요). PC와 핸드폰 둘 다 눌러 봐 주세요.</p>
  <div class="screen" id="screen"><span id="scrMsg">카드를 누르면 여기에 나와요<br>(보이는 라디오일 때는 영상)</span><video id="v" playsinline webkit-playsinline controls preload="none"></video></div>
  <div class="grid" id="list"></div>
  <div class="log" id="log">진행 기록이 여기에 나와요.</div>
  <footer class="myway-footer"><a href="https://myway.kr">MYWAY.KR</a></footer>
</div>
<a class="home-fab" href="https://myway.kr" aria-label="MYWAY.KR 홈" title="MYWAY.KR 홈">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/></svg>
</a>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
/* KBS도 방송 주소가 고정이 아니라 들을 때마다 KBS 서버가 잠깐 쓸 주소를 내줌 → 카드를 누르면 주소를 물어본 뒤 재생.
   응답에 '보이는 라디오(bora)' 주소가 같이 오면 그것(영상)을 틀고, 없으면 소리만 재생 */
var CH = [['1라디오', '21', '#2c5fa8,#1b3566'], ['2라디오 해피FM', '22', '#e8742c,#b3441e'], ['3라디오', '23', '#2fa58a,#1c6b6e'], ['클래식FM', '24', '#7a5bd0,#4a3a94'], ['쿨FM', '25', '#d9483b,#8f2b3e']];
var API = 'https://cfpwwwapi.kbs.co.kr/api/v1/landing/live/channel_code/';
var v = document.getElementById('v'), scr = document.getElementById('screen'), hls = null, cur = -1, seq = 0, needTap = -1;
function log(t){ var el = document.getElementById('log'); el.textContent = (el.textContent.indexOf('진행 기록이') === 0 ? '' : el.textContent + '\n') + t; }
function safe(u){ return String(u).split('?')[0].slice(0, 90); }   /* 기록에는 주소 앞부분만(임시 열쇠는 가림) */
document.getElementById('list').innerHTML = CH.map(function(c, i){
  return '<button type="button" class="card" data-i="' + i + '"><div class="art" style="background:linear-gradient(135deg,' + c[2] + ')">KBS<br>' + c[0] + '</div><div class="name">' + c[0] + '</div><div class="st"></div></button>';
}).join('');
function card(i){ return document.querySelector('.card[data-i="' + i + '"]'); }
function setSt(i, t, cls){ var c = card(i); if (!c) return; var e = c.querySelector('.st'); e.textContent = t; e.className = 'st' + (cls ? ' ' + cls : ''); }
function stopAll(){
  seq++; needTap = -1;
  if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
  var was = cur; cur = -1;
  try { v.pause(); v.removeAttribute('src'); v.load(); } catch(e){}
  scr.classList.remove('video'); document.getElementById('scrMsg').innerHTML = '카드를 누르면 여기에 나와요<br>(보이는 라디오일 때는 영상)';
  if (was >= 0) { card(was).classList.remove('on'); setSt(was, ''); }
}
function startStream(i, url, isVideo, my){
  if (my !== seq) return;
  log('② 재생 시작(' + (isVideo ? '보이는 라디오 영상' : '소리') + '): ' + safe(url));
  scr.classList.toggle('video', !!isVideo);
  if (!isVideo) document.getElementById('scrMsg').innerHTML = '♪ KBS ' + CH[i][0] + '<br>(지금은 보이는 라디오가 아니라 소리만 나와요)';
  if (/\.m3u8/.test(url) && !v.canPlayType('application/vnd.apple.mpegurl') && window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.on(Hls.Events.ERROR, function(ev, d){ if (d && d.fatal && my === seq){ setSt(i, '✕ 재생 실패', 'bad'); log('③ 재생 실패: ' + d.type + ' / ' + d.details + (d.response ? ' / 응답 ' + d.response.code : '')); } });
    hls.loadSource(url); hls.attachMedia(v);
  } else { v.src = url; }
  var p = v.play(); if (p && p.catch) p.catch(function(e){ if (my === seq){ needTap = i; setSt(i, '▶ 한 번 더 눌러 주세요', 'bad'); log('③ 자동 재생이 막힘(' + (e && e.name) + ') → 카드를 한 번 더 누르면 재생'); } });
}
function play(i){
  if (i === cur && needTap === i) { needTap = -1; var pr = v.play(); if (pr && pr.catch) pr.catch(function(e){ log('③ 다시 눌러도 재생 거부: ' + (e && e.name)); }); return; }
  var same = (i === cur); stopAll(); if (same) return;
  cur = i; var my = seq, c = CH[i];
  card(i).classList.add('on'); setSt(i, '주소 받는 중…');
  log('── KBS ' + c[0] + ' ──\n① KBS 서버에 주소 요청');
  fetch(API + c[1], { cache: 'no-store' }).then(function(r){
    if (!r.ok) throw new Error('응답 ' + r.status);
    return r.json();
  }).then(function(d){
    if (my !== seq) return;
    var items = (d && d.channel_item) || [], radio = '', bora = '', kinds = [];
    items.forEach(function(it){
      var mt = String((it && it.media_type) || ''), u = String((it && it.service_url) || '');
      kinds.push(mt + (u ? '' : '(주소없음)'));
      if (!u) return;
      if (/bora/i.test(mt)) bora = bora || u; else if (/radio/i.test(mt)) radio = radio || u;
    });
    if (!radio && !bora) { try { var all = JSON.stringify(d).match(/https?:[^"\\\s]+m3u8[^"\\\s]*/g) || []; radio = (all[0] || '').replace(/\\\//g, '/'); } catch(e){} }
    log('① 응답 받음 — 종류: ' + (kinds.join(', ') || '없음') + (d && d.channelMaster ? ' / 보이는라디오 표시: ' + ((d.channelMaster.bora_status !== undefined) ? d.channelMaster.bora_status : '?') : ''));
    if (!radio && !bora) { setSt(i, '✕ 주소를 못 받음', 'bad'); log('① 응답에 방송 주소가 없음 (항목: ' + Object.keys(d || {}).join(',') + ')'); return; }
    startStream(i, bora || radio, !!bora, my);
  }).catch(function(e){
    if (my !== seq) return;
    setSt(i, '✕ 주소를 못 받음', 'bad');
    log('① 주소 요청 실패: ' + (e && (e.message || e.name)) + '\n   (KBS 서버가 마이웨이에서 온 요청을 막은 경우 이렇게 나와요)');
  });
}
v.addEventListener('playing', function(){ if (cur >= 0){ setSt(cur, '♪ 재생 중', 'ok'); log('③ 재생 중'); } });
v.addEventListener('error', function(){ if (cur >= 0){ setSt(cur, '✕ 재생 실패', 'bad'); log('③ 재생 실패(오류 ' + ((v.error || {}).code || '?') + ')'); } });
document.getElementById('list').addEventListener('click', function(e){ var c = e.target.closest('.card'); if (c) play(+c.getAttribute('data-i')); });

/* 복사 방지 (진행 기록은 복사 가능) */
function inLog(t){ var n = t && t.nodeType === 3 ? t.parentNode : t; return !!(n && n.closest && n.closest('#log')); }
['contextmenu','dragstart','selectstart','copy','cut'].forEach(function(ev){ document.addEventListener(ev, function(e){ if (!inLog(e.target)) e.preventDefault(); }); });
document.addEventListener('keydown', function(e){
  var k = (e.key||'').toLowerCase();
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && /^[ijc]$/.test(k)) || (e.ctrlKey && !e.shiftKey && /^[usxa]$/.test(k))) e.preventDefault();
});
</script>
</body>
</html>
