<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>해외 라디오 · 미국 영국 일본 | MYWAY.KR</title>
<meta name="description" content="미국·영국·일본의 대표 라디오 방송을 한 화면에서. 방송을 골라 바로 들어 보세요.">
<link rel="canonical" href="https://myway.kr/radio-world.html">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{background:#f7f3eb;color:#1f2740;font-family:"Pretendard",-apple-system,sans-serif;font-size:12.5px;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  input,textarea{user-select:text;-webkit-user-select:text}

  .wr-main{max-width:1040px;margin:0 auto;padding:22px 14px 90px}
  .wr-flag{font-size:13.5px;font-weight:800;color:#5b4bdb;margin:22px 4px 10px}
  .wr-flag:first-child{margin-top:0}
  .wr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .wr-card{background:#fff;border:1px solid #e6e2d8;border-radius:14px;padding:13px 13px 12px;box-shadow:0 4px 12px rgba(90,90,130,.08);transition:border-color .2s,box-shadow .2s}
  .wr-card.on{border-color:#8a80dc;box-shadow:0 0 0 2px rgba(138,128,220,.35),0 6px 16px rgba(90,100,180,.2)}
  .wr-name{font-size:14.5px;font-weight:800;letter-spacing:-.2px}
  .wr-desc{color:#8a8f99;margin:3px 0 10px;line-height:1.45}
  .wr-player{border-radius:9px;overflow:hidden;background:#f1f1f4;height:100px}
  .wr-player iframe{display:block;width:100%;height:100px;border:0}
  @media (max-width:720px){ .wr-grid{grid-template-columns:1fr} .wr-main{padding-top:16px} }
  .myway-footer{text-align:center;color:#8a8f99;padding:30px 0 0}
  .myway-footer a{color:#6a5fd0;font-weight:700;text-decoration:none}
  .home-fab{position:fixed;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#6fb3d8,#8a80dc 50%,#a98be3);box-shadow:0 6px 16px rgba(90,100,180,.35);z-index:50}
  .home-fab svg{width:21px;height:21px}
  .embedded .home-fab{display:none}   /* 마이웨이 화면 안에 들어가 있을 때는 숨김(위쪽 탭바가 있음) */
</style>
</head>
<body>
<main class="wr-main">
  <div id="wrList"></div>
  <footer class="myway-footer"><a href="https://myway.kr" target="_top">MYWAY.KR</a></footer>
</main>
<a class="home-fab" href="https://myway.kr" target="_top" aria-label="MYWAY.KR 홈" title="MYWAY.KR 홈">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/></svg>
</a>
<script>
try { if (window.self !== window.top) document.documentElement.classList.add('embedded'); } catch(e){ document.documentElement.classList.add('embedded'); }

/* === 해외 라디오 목록: [국가, 이름, 설명, TuneIn 채널 번호] === */
var STATIONS = [
  ['🇺🇸 미국', 'KCRW News', '로스앤젤레스 공영 라디오 · NPR 뉴스/토크', 's44525'],
  ['🇺🇸 미국', 'Jazz24', '시애틀 공영 라디오의 24시간 재즈 채널', 's34682'],
  ['🇬🇧 영국', 'BBC World Service', 'BBC 국제 방송 · 24시간 영어 뉴스', 's24948'],
  ['🇬🇧 영국', 'Classic FM', '영국 최대 민영 라디오 · 클래식 음악', 's8439'],
  ['🇯🇵 일본', 'NHK WORLD-JAPAN', 'NHK 국제 방송 · 일본·아시아 뉴스', 's310605'],
  ['🇯🇵 일본', 'Shonan Beach FM', '가나가와 즈시의 FM · 재즈/올드팝', 's8138']
];
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function src(i){ return 'https://tunein.com/embed/player/' + STATIONS[i][3] + '/'; }
(function(){
  var html = '', last = '';
  STATIONS.forEach(function(s, i){
    if (s[0] !== last) { html += (last ? '</div>' : '') + '<div class="wr-flag">' + esc(s[0]) + '</div><div class="wr-grid">'; last = s[0]; }
    html += '<div class="wr-card" data-i="' + i + '"><div class="wr-name">' + esc(s[1]) + '</div><div class="wr-desc">' + esc(s[2]) + '</div>' +
      '<div class="wr-player"><iframe title="' + esc(s[1]) + '" scrolling="no" allow="autoplay; encrypted-media" src="' + src(i) + '"></iframe></div></div>';
  });
  document.getElementById('wrList').innerHTML = html + '</div>';
})();
/* 한 번에 한 방송만: 어느 플레이어를 누르면(그 iframe이 포커스를 받음) 그 전에 눌렀던 플레이어는 새로 불러와 정지시킴.
   TuneIn 플레이어는 다른 사이트 화면이라 직접 정지 명령을 보낼 수 없어, 누른 플레이어를 포커스로 알아냄 */
var active = -1, touched = {};
function checkFocus(){
  var el = document.activeElement;
  if (!el || el.tagName !== 'IFRAME') return;
  var card = el.closest('.wr-card'); if (!card) return;
  var i = +card.getAttribute('data-i'); if (i === active) return;
  active = i; touched[i] = true;
  Array.prototype.forEach.call(document.querySelectorAll('.wr-card'), function(c){
    var j = +c.getAttribute('data-i');
    c.classList.toggle('on', j === i);
    if (j !== i && touched[j]) { touched[j] = false; var f = c.querySelector('iframe'); if (f) f.src = src(j); }
  });
}
window.addEventListener('blur', function(){ setTimeout(checkFocus, 0); });
setInterval(checkFocus, 400);

/* 복사 방지 */
['contextmenu','selectstart','dragstart','copy','cut'].forEach(function(ev){
  document.addEventListener(ev, function(e){ if (!/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||'')) e.preventDefault(); });
});
document.addEventListener('keydown', function(e){
  var k = (e.key||'').toLowerCase();
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && /^[ijc]$/.test(k)) || (e.ctrlKey && !e.shiftKey && /^[uscxa]$/.test(k) && !/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||''))) e.preventDefault();
});
</script>
</body>
</html>
