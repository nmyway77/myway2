<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>해외 라디오 · 미국 영국 일본 | MYWAY.KR</title>
<meta name="description" content="미국·영국·일본의 대표 라디오 방송을 한 화면에서. 방송을 골라 바로 들어 보세요.">
<link rel="canonical" href="https://myway.kr/radio-world.html">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{background:#f7f3eb;color:#1f2740;font-family:"Pretendard",-apple-system,sans-serif;font-size:12.5px;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  input,textarea{user-select:text;-webkit-user-select:text}

  /* 상단 방송 네비 — 뉴스바와 같은 볼록한 알약 버튼 */
  .wr-nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;overflow-x:auto;white-space:nowrap;padding:10px 14px 13px;
    background:linear-gradient(180deg,#f7f8fc 0%,#eceef7 100%);border-bottom:1px solid #dcdfee;box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(90,100,180,.16);scrollbar-width:none}
  .wr-nav::-webkit-scrollbar{display:none}
  .wr-track{display:flex;align-items:center;gap:8px;margin:0 auto}
  .wr-flag{flex:none;font-size:11.5px;font-weight:800;color:#8a90b4;padding:0 2px 0 8px}
  .wr-flag:first-child{padding-left:0}
  .wr-btn{flex:none;border:1px solid rgba(255,255,255,.85);border-radius:999px;padding:7px 15px;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:-.2px;color:#5d6388;cursor:pointer;
    background:linear-gradient(135deg,#ffffff 0%,#f4f5fc 50%,#eceafa 100%);
    box-shadow:0 5px 12px rgba(90,100,180,.2),0 1px 3px rgba(75,45,189,.12),inset 0 2px 5px rgba(255,255,255,.95),inset 0 -3px 6px rgba(75,45,189,.09);
    transition:color .18s,box-shadow .18s,transform .12s}
  .wr-btn:hover{color:#4b4f9a}
  .wr-btn:active{transform:translateY(1px)}
  .wr-btn.on{color:#fff;border-color:rgba(255,255,255,.4);text-shadow:0 1px 2px rgba(0,0,0,.15);
    background:linear-gradient(135deg,#6fb3d8 0%,#8a80dc 50%,#a98be3 100%);
    box-shadow:0 6px 14px rgba(90,100,180,.34),0 2px 5px rgba(75,45,189,.2),inset 0 2px 6px rgba(255,255,255,.45),inset 0 -3px 6px rgba(75,45,189,.22)}

  .wr-main{max-width:720px;margin:0 auto;padding:38px 14px 90px}
  .wr-card{background:#fff;border:1px solid #e6e2d8;border-radius:16px;padding:22px 20px 16px;box-shadow:0 6px 20px rgba(90,90,130,.1)}
  .wr-country{font-size:12px;font-weight:800;color:#6a5fd0;letter-spacing:.3px}
  .wr-name{font-size:21px;font-weight:800;letter-spacing:-.4px;margin:5px 0 4px}
  .wr-desc{color:#8a8f99;font-size:13px;line-height:1.5;margin:0 0 16px}
  .wr-player{border-radius:10px;overflow:hidden;background:#f1f1f4;min-height:100px}
  .wr-player iframe{display:block;width:100%;height:100px;border:0}
  .wr-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;color:#9aa0b4;font-size:12px}
  .wr-foot a{flex:none;color:#6a5fd0;font-weight:700;text-decoration:none}
  .wr-foot a:hover{text-decoration:underline}
  .myway-footer{text-align:center;color:#8a8f99;padding:30px 0 0}
  .myway-footer a{color:#6a5fd0;font-weight:700;text-decoration:none}
  .home-fab{position:fixed;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#6fb3d8,#8a80dc 50%,#a98be3);box-shadow:0 6px 16px rgba(90,100,180,.35);z-index:50}
  .home-fab svg{width:21px;height:21px}
  .embedded .home-fab{display:none}   /* 마이웨이 화면 안에 들어가 있을 때는 숨김(위쪽 탭바가 있음) */
  @media (max-width:720px){ .wr-nav{gap:7px;padding:8px 10px 12px} .wr-track{gap:7px;margin:0} .wr-btn{padding:6px 13px;font-size:12.5px} .wr-main{padding-top:22px} .wr-name{font-size:18px} }
</style>
</head>
<body>
<nav class="wr-nav"><div class="wr-track" id="wrTrack"></div></nav>
<main class="wr-main">
  <div class="wr-card">
    <div class="wr-country" id="wrCountry"></div>
    <div class="wr-name" id="wrName"></div>
    <p class="wr-desc" id="wrDesc"></p>
    <div class="wr-player" id="wrPlayer"></div>
    <div class="wr-foot"><span>▶ 버튼을 누르면 재생돼요. 안내 창이 뜨면 ✕로 닫아 주세요.</span><a id="wrOpen" href="#" target="_blank" rel="noopener">새 창에서 열기 ↗</a></div>
  </div>
  <footer class="myway-footer"><a href="https://myway.kr" target="_top">MYWAY.KR</a></footer>
</main>
<a class="home-fab" href="https://myway.kr" target="_top" aria-label="MYWAY.KR 홈" title="MYWAY.KR 홈">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/></svg>
</a>
<script>
try { if (window.self !== window.top) document.documentElement.classList.add('embedded'); } catch(e){ document.documentElement.classList.add('embedded'); }

/* === 해외 라디오 목록: [국가, 이름, 설명, TuneIn 채널 번호] === */
var STATIONS = [
  ['🇺🇸 미국', 'KCRW News', '로스앤젤레스 공영 라디오 · NPR 뉴스/토크', 's44525'],
  ['🇺🇸 미국', 'Jazz24', '시애틀 공영 라디오의 24시간 재즈 채널', 's34682'],
  ['🇬🇧 영국', 'BBC World Service', 'BBC 국제 방송 · 24시간 영어 뉴스', 's24948'],
  ['🇬🇧 영국', 'Classic FM', '영국 최대 민영 라디오 · 클래식 음악', 's8439'],
  ['🇯🇵 일본', 'NHK WORLD-JAPAN', 'NHK 국제 방송 · 일본·아시아 뉴스', 's310605'],
  ['🇯🇵 일본', 'Shonan Beach FM', '가나가와 즈시의 FM · 재즈/올드팝', 's8138']
];
var cur = -1;
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function renderNav(){
  var html = '', last = '';
  STATIONS.forEach(function(s, i){
    if (s[0] !== last) { html += '<span class="wr-flag">' + esc(s[0]) + '</span>'; last = s[0]; }
    html += '<button type="button" class="wr-btn' + (i === cur ? ' on' : '') + '" data-i="' + i + '">' + esc(s[1]) + '</button>';
  });
  $('wrTrack').innerHTML = html;
}
/* 플레이어는 항상 1개만 — 다른 방송을 누르면 이전 플레이어를 없애고 새로 만듦(이전 방송 정지) */
function pick(i){
  var s = STATIONS[i]; if (!s) return;
  cur = i;
  $('wrCountry').textContent = s[0];
  $('wrName').textContent = s[1];
  $('wrDesc').textContent = s[2];
  $('wrOpen').href = 'https://tunein.com/radio/' + s[3];
  $('wrPlayer').innerHTML = '';
  var f = document.createElement('iframe');
  f.title = s[1]; f.setAttribute('scrolling', 'no'); f.setAttribute('allow', 'autoplay; encrypted-media');
  f.src = 'https://tunein.com/embed/player/' + s[3] + '/';
  $('wrPlayer').appendChild(f);
  renderNav();
  var b = $('wrTrack').querySelector('.wr-btn.on'); if (b) { try { b.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch(e){} }
}
$('wrTrack').addEventListener('click', function(e){ var b = e.target.closest('.wr-btn'); if (b) pick(+b.getAttribute('data-i')); });
pick(2);   /* 처음 화면: BBC World Service */

/* 복사 방지 */
['contextmenu','selectstart','dragstart','copy','cut'].forEach(function(ev){
  document.addEventListener(ev, function(e){ if (!/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||'')) e.preventDefault(); });
});
document.addEventListener('keydown', function(e){
  var k = (e.key||'').toLowerCase();
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && /^[ijc]$/.test(k)) || (e.ctrlKey && !e.shiftKey && /^[uscxa]$/.test(k) && !/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||''))) e.preventDefault();
});
</script>
</body>
</html>
