<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 용량 줄이기 · MYWAY.KR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --paper:#f7f3eb; --board:#e8e1d2; --card:#fffdf8; --line:#d9d0bd;
  --ink:#2a2733; --mute:#777084; --ok:#1f8a5b; --warn:#c0392b;
  --a1:#7c4dff; --a2:#3d7bff; --grad:linear-gradient(135deg,var(--a1),var(--a2));
  --f-display:'Fraunces',Georgia,serif;
  --f-body:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:13px;line-height:1.5;
  -webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit}
button,select{font-family:inherit;font-size:12.5px;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 76px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;letter-spacing:-.01em}
.head h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.head p{margin:0;color:var(--mute)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}

.board{background:var(--board);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar .sum{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 11px;line-height:1.3}
.btn:hover{border-color:var(--a1)}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.main{background:var(--grad);color:#fff;border-color:transparent;font-weight:600}
.btn:focus-visible,.drop:focus-within{outline:2px solid var(--a2);outline-offset:2px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;
  min-height:300px;border:2px dashed #b9ad94;border-radius:8px;background:var(--card);cursor:pointer;padding:24px}
.drop.over{border-color:var(--a1);background:#f1ecff}
.drop b{font-size:16px}
.drop small{color:var(--mute)}
.drop .pick{background:var(--grad);color:#fff;border-radius:7px;padding:8px 18px;font-weight:600}
.list{display:flex;flex-direction:column;gap:6px}
.list.over{outline:2px dashed var(--a1);outline-offset:4px;border-radius:8px}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.row img{width:64px;height:48px;object-fit:cover;border-radius:5px;background:#eee}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--mute)}
.row .meta b{color:var(--ok)}
.row .meta b.up{color:var(--warn)}
.row .acts{display:flex;gap:4px}
.row .acts .btn{padding:4px 8px;font-size:12px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 6px;font-family:var(--f-mono);font-weight:600}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.fld{display:flex;align-items:center;gap:8px}
.fld input[type=range]{flex:1;accent-color:var(--a1)}
.fld input[type=number]{width:84px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;font-family:var(--f-mono)}
.fld .v{font-family:var(--f-mono);width:42px;text-align:right}
.note{color:var(--mute);font-size:12px;margin:4px 0 0}
label.ck{display:flex;align-items:center;gap:6px;cursor:pointer}
label.ck input{accent-color:var(--a1)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:12.5px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast.bad{background:var(--warn)}
.home{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;
  text-decoration:none;font-size:20px;box-shadow:0 6px 18px rgba(61,123,255,.35);z-index:40}
footer{text-align:center;color:var(--mute);font-size:12px;padding:18px 0 0}
footer a{color:var(--a1);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>사진 <span>용량 줄이기</span></h1>
    <p>사진을 이 브라우저 안에서만 줄여요. 서버로 올라가지 않아요.</p>
  </div>

  <div class="grid">
    <section class="board">
      <div class="bar" id="bar" hidden>
        <button class="btn" id="btnAdd">+ 사진 추가</button>
        <button class="btn main" id="btnRun">줄이기 실행</button>
        <button class="btn" id="btnZip" disabled>전체 ZIP 저장</button>
        <button class="btn" id="btnClear">모두 지우기</button>
        <span class="sum" id="sum"></span>
      </div>
      <label class="drop" id="drop">
        <b>사진을 여기에 끌어다 놓으세요</b>
        <small>JPG · PNG · WEBP · GIF(첫 장면) · 여러 장 한꺼번에 가능</small>
        <span class="pick">사진 고르기</span>
        <input type="file" id="file" accept="image/*" multiple hidden>
      </label>
      <div class="list" id="list" hidden></div>
    </section>

    <aside class="panel">
      <div>
        <h2>방식</h2>
        <div class="chips" id="modeChips">
          <button class="chip on" data-mode="q">화질 지정</button>
          <button class="chip" data-mode="kb">목표 용량</button>
        </div>
      </div>
      <div id="boxQ">
        <h2>화질</h2>
        <div class="fld"><input type="range" id="q" min="10" max="100" value="75"><span class="v" id="qv">75%</span></div>
        <p class="note">70~80%면 눈으로 차이가 거의 없어요.</p>
      </div>
      <div id="boxKB" hidden>
        <h2>목표 용량 (장당)</h2>
        <div class="fld"><input type="number" id="kb" min="20" max="20000" step="10" value="500"><span>KB 이하</span></div>
        <div class="chips" style="margin-top:6px">
          <button class="chip" data-kb="200">200KB</button>
          <button class="chip" data-kb="500">500KB</button>
          <button class="chip" data-kb="1000">1MB</button>
          <button class="chip" data-kb="2000">2MB</button>
        </div>
        <p class="note">화질을 자동으로 맞추고, 그래도 크면 크기를 조금씩 줄여요. PNG 형식에서는 쓸 수 없어요.</p>
      </div>
      <div>
        <h2>최대 크기 (긴 변)</h2>
        <div class="chips" id="sizeChips">
          <button class="chip on" data-px="0">원본</button>
          <button class="chip" data-px="3840">3840</button>
          <button class="chip" data-px="2560">2560</button>
          <button class="chip" data-px="1920">1920</button>
          <button class="chip" data-px="1280">1280</button>
          <button class="chip" data-px="800">800</button>
        </div>
        <div class="fld" style="margin-top:6px"><span>직접:</span><input type="number" id="px" min="0" max="20000" step="10" value="0"><span>px (0 = 원본)</span></div>
      </div>
      <div>
        <h2>저장 형식</h2>
        <div class="chips" id="fmtChips">
          <button class="chip on" data-fmt="jpg">JPG</button>
          <button class="chip" data-fmt="webp">WEBP</button>
          <button class="chip" data-fmt="png">PNG</button>
        </div>
        <p class="note" id="fmtNote">JPG는 투명한 부분이 흰색이 돼요.</p>
      </div>
      <div>
        <label class="ck"><input type="checkbox" id="keepBig" checked> 줄인 결과가 더 크면 원본 유지</label>
      </div>
    </aside>
  </div>

  <footer>© <a href="https://myway.kr" target="_top">myway.kr</a></footer>
</div>
<a class="home" href="https://myway.kr" target="_top" title="홈으로">⌂</a>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var items=[]; // {id,file,url,w,h,out:{blob,url,w,h,name,kept}}
var uid=0, mode='q', fmt='jpg', busy=false;

function fmtSize(b){ if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(b<10240?1:0)+' KB'; return (b/1048576).toFixed(2)+' MB'; }
var toastT;
function toast(msg,bad){
  var t=document.querySelector('.toast'); if(t) t.remove(); clearTimeout(toastT);
  t=document.createElement('div'); t.className='toast'+(bad?' bad':''); t.textContent=msg; document.body.appendChild(t);
  toastT=setTimeout(function(){t.remove();},2600);
}

/* ---------- 칩 그룹 ---------- */
function chipGroup(box,attr,fn){
  box.addEventListener('click',function(e){
    var b=e.target.closest('.chip'); if(!b||!box.contains(b)) return;
    box.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',c===b);});
    fn(b.getAttribute(attr));
  });
}
chipGroup($('modeChips'),'data-mode',function(v){ mode=v; $('boxQ').hidden=v!=='q'; $('boxKB').hidden=v!=='kb'; syncFmt(); markDirty(); });
chipGroup($('sizeChips'),'data-px',function(v){ $('px').value=v; markDirty(); });
chipGroup($('fmtChips'),'data-fmt',function(v){ fmt=v; syncFmt(); markDirty(); });
document.querySelectorAll('[data-kb]').forEach(function(b){ b.addEventListener('click',function(){ $('kb').value=b.getAttribute('data-kb'); markDirty(); }); });
$('q').addEventListener('input',function(){ $('qv').textContent=this.value+'%'; markDirty(); });
$('px').addEventListener('input',function(){
  var v=String(parseInt(this.value,10)||0);
  $('sizeChips').querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',c.getAttribute('data-px')===v);});
  markDirty();
});
$('kb').addEventListener('input',markDirty);
$('keepBig').addEventListener('change',markDirty);
function syncFmt(){
  var note={jpg:'JPG는 투명한 부분이 흰색이 돼요.',webp:'WEBP는 JPG보다 더 작아요. 투명도 유지.',png:'PNG는 화질 손실이 없지만 용량이 잘 안 줄어요. 크기 줄이기와 같이 쓰세요.'}[fmt];
  if(fmt==='png'&&mode==='kb') note='PNG는 목표 용량을 쓸 수 없어요 — JPG나 WEBP를 고르세요.';
  $('fmtNote').textContent=note;
  $('q').disabled=fmt==='png';
}

/* ---------- 파일 받기 ---------- */
var drop=$('drop'), list=$('list');
$('file').addEventListener('change',function(){ addFiles(this.files); this.value=''; });
$('btnAdd').addEventListener('click',function(){ $('file').click(); });
[drop,list].forEach(function(el){
  el.addEventListener('dragover',function(e){ e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave',function(){ el.classList.remove('over'); });
  el.addEventListener('drop',function(e){ e.preventDefault(); el.classList.remove('over'); addFiles(e.dataTransfer.files); });
});
document.addEventListener('paste',function(e){
  var fs=[]; var its=(e.clipboardData&&e.clipboardData.items)||[];
  for(var i=0;i<its.length;i++){ if(its[i].kind==='file'){ var f=its[i].getAsFile(); if(f) fs.push(f); } }
  if(fs.length) addFiles(fs);
});

function loadImg(url){
  return new Promise(function(res,rej){ var im=new Image(); im.onload=function(){res(im);}; im.onerror=rej; im.src=url; });
}
function addFiles(fl){
  var arr=Array.prototype.slice.call(fl||[]).filter(function(f){return /^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name);});
  if(!arr.length){ toast('사진 파일만 넣을 수 있어요.',true); return; }
  var skipped=0;
  Promise.all(arr.map(function(f){
    var url=URL.createObjectURL(f);
    return loadImg(url).then(function(im){
      items.push({id:++uid,file:f,url:url,w:im.naturalWidth,h:im.naturalHeight,out:null});
    },function(){ URL.revokeObjectURL(url); skipped++; });
  })).then(function(){
    if(skipped) toast(skipped+'개는 이 브라우저가 열 수 없는 형식이에요 (예: HEIC).',true);
    render();
  });
}

/* ---------- 목록 ---------- */
function render(){
  var has=items.length>0;
  drop.hidden=has; list.hidden=!has; $('bar').hidden=!has;
  list.innerHTML='';
  items.forEach(function(it){
    var r=document.createElement('div'); r.className='row';
    var o=it.out, meta;
    if(o){
      var pct=Math.round((1-o.blob.size/it.file.size)*100);
      meta=it.w+'×'+it.h+' · '+fmtSize(it.file.size)+' → '+(o.w+'×'+o.h)+' · <b'+(pct<0?' class="up"':'')+'>'+fmtSize(o.blob.size)+' ('+(pct>=0?'-'+pct:'+'+(-pct))+'%)</b>'+(o.kept?' · 원본 유지':'');
    } else meta=it.w+'×'+it.h+' · '+fmtSize(it.file.size)+' · 대기 중';
    r.innerHTML='<img alt=""><div style="min-width:0"><div class="nm"></div><div class="meta">'+meta+'</div></div>'+
      '<div class="acts"><button class="btn" data-a="save"'+(o?'':' disabled')+'>저장</button><button class="btn" data-a="del" title="빼기">✕</button></div>';
    r.querySelector('img').src=it.url;
    r.querySelector('.nm').textContent=o?o.name:it.file.name;
    r.querySelector('[data-a=save]').onclick=function(){ download(o.blob,o.name); };
    r.querySelector('[data-a=del]').onclick=function(){ dropItem(it); };
    list.appendChild(r);
  });
  var done=items.filter(function(i){return i.out;});
  var before=items.reduce(function(a,i){return a+i.file.size;},0);
  var after=done.reduce(function(a,i){return a+i.out.blob.size;},0);
  $('sum').textContent=items.length+'장 · '+fmtSize(before)+(done.length===items.length&&has?' → '+fmtSize(after):'');
  $('btnZip').disabled=!(has&&done.length===items.length);
}
function freeOut(it){ if(it.out){ it.out=null; } }
function dropItem(it){ URL.revokeObjectURL(it.url); items=items.filter(function(x){return x!==it;}); render(); }
function markDirty(){ if(busy) return; var ch=false; items.forEach(function(it){ if(it.out){ freeOut(it); ch=true; } }); if(ch) render(); }
$('btnClear').addEventListener('click',function(){ items.forEach(function(it){URL.revokeObjectURL(it.url);}); items=[]; render(); });

/* ---------- 줄이기 ---------- */
function mime(){ return fmt==='png'?'image/png':fmt==='webp'?'image/webp':'image/jpeg'; }
function ext(){ return fmt==='jpg'?'jpg':fmt; }
function toBlob(c,type,q){ return new Promise(function(res){ c.toBlob(function(b){res(b);},type,q); }); }
function draw(im,w,h){
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  var g=c.getContext('2d');
  if(fmt==='jpg'){ g.fillStyle='#fff'; g.fillRect(0,0,w,h); }
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
  // 크게 줄일 때는 절반씩 단계적으로 줄여 계단현상 방지
  var src=im, sw=im.naturalWidth||im.width, sh=im.naturalHeight||im.height;
  while(sw/2>w && sh/2>h){
    var t=document.createElement('canvas'); t.width=Math.round(sw/2); t.height=Math.round(sh/2);
    var tg=t.getContext('2d'); tg.imageSmoothingQuality='high'; tg.drawImage(src,0,0,t.width,t.height);
    src=t; sw=t.width; sh=t.height;
  }
  g.drawImage(src,0,0,w,h);
  return c;
}
function fitSize(w,h,max){
  if(!max||(w<=max&&h<=max)) return {w:w,h:h};
  var s=max/Math.max(w,h); return {w:Math.max(1,Math.round(w*s)),h:Math.max(1,Math.round(h*s))};
}
async function compress(it,im){
  var max=parseInt($('px').value,10)||0;
  var sz=fitSize(it.w,it.h,max), type=mime();
  if(mode==='kb'&&fmt!=='png'){
    var target=Math.max(20,parseInt($('kb').value,10)||500)*1024, best=null, scale=1;
    for(var round=0;round<8;round++){
      var w=Math.max(1,Math.round(sz.w*scale)), h=Math.max(1,Math.round(sz.h*scale));
      var c=draw(im,w,h), lo=0.3, hi=0.95, ok=null;
      var top=await toBlob(c,type,hi);
      if(top&&top.size<=target){ ok={blob:top,w:w,h:h}; }
      else{
        for(var k=0;k<7;k++){
          var mid=(lo+hi)/2, b=await toBlob(c,type,mid);
          if(b&&b.size<=target){ ok={blob:b,w:w,h:h}; lo=mid; } else hi=mid;
        }
      }
      if(ok){ best=ok; break; }
      var low=await toBlob(c,type,0.3);
      best={blob:low,w:w,h:h};
      scale*=Math.max(0.5,Math.min(0.9,Math.sqrt(target/low.size)*0.95));
    }
    return best;
  }
  var cv=draw(im,sz.w,sz.h);
  var blob=await toBlob(cv,type,fmt==='png'?undefined:parseInt($('q').value,10)/100);
  return {blob:blob,w:sz.w,h:sz.h};
}
function outName(it,keptOrig){
  var base=it.file.name.replace(/\.[^.]+$/,'')||'photo';
  if(keptOrig) return it.file.name;
  return base+'_small.'+ext();
}
$('btnRun').addEventListener('click',async function(){
  if(busy||!items.length) return;
  if(fmt==='png'&&mode==='kb'){ toast('PNG는 목표 용량을 쓸 수 없어요. JPG나 WEBP를 고르세요.',true); return; }
  busy=true; var btn=this; btn.disabled=true;
  try{
    for(var i=0;i<items.length;i++){
      var it=items[i];
      btn.textContent='처리 중 '+(i+1)+'/'+items.length;
      try{
        var im=await loadImg(it.url);
        var r=await compress(it,im);
        if(!r||!r.blob) throw 0;
        var kept=false;
        if($('keepBig').checked&&r.blob.size>=it.file.size){ r={blob:it.file,w:it.w,h:it.h}; kept=true; }
        it.out={blob:r.blob,w:r.w,h:r.h,kept:kept,name:outName(it,kept)};
      }catch(err){ it.out=null; toast(it.file.name+' 처리 실패',true); }
      render();
    }
    var done=items.filter(function(x){return x.out;}).length;
    if(done) toast(done+'장 완료 — 저장 버튼을 눌러 받으세요.');
  } finally { busy=false; btn.disabled=false; btn.textContent='줄이기 실행'; }
});

/* ---------- 저장 ---------- */
function download(blob,name){
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
}
$('btnZip').addEventListener('click',async function(){
  var done=items.filter(function(i){return i.out;});
  if(!done.length) return;
  if(done.length===1){ download(done[0].out.blob,done[0].out.name); return; }
  if(!window.JSZip){ toast('ZIP 도구를 불러오지 못했어요. 한 장씩 저장해 주세요.',true); return; }
  var zip=new JSZip(), used={};
  done.forEach(function(it){
    var n=it.out.name, k=1;
    while(used[n]){ n=it.out.name.replace(/(\.[^.]+)$/,'('+(++k)+')$1'); }
    used[n]=1; zip.file(n,it.out.blob);
  });
  this.disabled=true;
  try{ var z=await zip.generateAsync({type:'blob',compression:'STORE'}); download(z,'photos_small.zip'); }
  finally{ this.disabled=false; }
});

/* ---------- 복사 방지 (사이트 공통 정책) ---------- */
function isField(t){ return t&&(/^(INPUT|TEXTAREA)$/).test(t.tagName); }
['contextmenu','selectstart','dragstart','copy','cut'].forEach(function(ev){
  document.addEventListener(ev,function(e){ if(!isField(e.target)) e.preventDefault(); });
});
document.addEventListener('keydown',function(e){
  var k=(e.key||'').toLowerCase(), ctrl=e.ctrlKey||e.metaKey;
  if(k==='f12'||(ctrl&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(ctrl&&(k==='u'||k==='s'))){ e.preventDefault(); return; }
  if(ctrl&&(k==='c'||k==='x'||k==='a')&&!isField(e.target)){ e.preventDefault(); }
});
syncFmt();
})();
</script>
</body>
</html>
