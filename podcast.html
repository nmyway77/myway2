<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팟캐스트 · 라이브 토크 | MYWAY.KR</title>
<meta name="description" content="경제·시사·교양·토크 유튜브 라이브와 최신 회차를 한 화면에서">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2433; --sub:#6b7385; --accent:#e5384f; --line:#e3e6ec; --side:280px; --tabsH:56px; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }

  /* 상단 분류 탭 */
  .tabs { height:var(--tabsH); display:flex; align-items:center; gap:8px; padding:0 16px; background:var(--card); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs > :first-child { margin-left:auto; }
  .tabs > :last-child { margin-right:auto; }
  .tabs button { flex:none; border:1px solid var(--line); background:var(--card); padding:7px 16px; border-radius:20px; cursor:pointer; font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; }
  .tabs button:hover { border-color:#b9bfcc; }
  .tabs button.on { background:var(--text); color:#fff; border-color:var(--text); }
  /* myway.kr 탭바 자리에 들어갔을 때(?nav=1): 맨 앞 [← 메뉴] — 좌우로 밀어도 왼쪽에 고정 */
  .tabs > .nav-back { display:none; }
  body.navswap .tabs > .nav-back { display:inline-flex; align-items:center; gap:5px; margin-left:0; position:sticky; left:0; z-index:2; color:#5b4bdb; font-weight:800; box-shadow:-16px 0 0 var(--card); }
  body.navswap .tabs > .nav-back svg { width:14px; height:14px; display:block; }
  body.navswap .tabs > .nav-back + button { margin-left:auto; }

  /* 본문: 왼쪽 화면 + 오른쪽 채널 */
  .top { height:100%; }
  .wrap { height:calc(100% - var(--tabsH)); display:flex; }
  .stage { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px 14px 8px; }
  .player { position:relative; width:100%; max-width:calc((100vh - var(--tabsH) - 96px) * 16 / 9); aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; }
  .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .player .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#aaa; font-size:15px; text-align:center; padding:0 20px; }
  .bar { width:100%; max-width:calc((100vh - var(--tabsH) - 96px) * 16 / 9); display:flex; align-items:center; gap:8px; margin-top:8px; min-height:32px; }
  .now { flex:1; min-width:0; font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now small { color:var(--sub); font-weight:400; margin-left:6px; }
  .mode { flex:none; display:flex; gap:6px; }
  .mode button { border:1px solid var(--line); background:var(--card); padding:6px 12px; border-radius:16px; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--text); white-space:nowrap; }
  .mode button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .hint { width:100%; max-width:calc((100vh - var(--tabsH) - 96px) * 16 / 9); font-size:11.5px; color:var(--sub); margin-top:4px; min-height:16px; }

  /* 오른쪽 채널 목록 */
  .side { flex:none; width:var(--side); display:flex; flex-direction:column; background:var(--card); border-left:1px solid var(--line); min-height:0; }
  .list { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .card { position:relative; flex:none; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 34px 9px 12px; cursor:pointer; }
  .card:hover { border-color:#b9bfcc; }
  .card.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .card b { display:block; font-size:14px; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .meta { font-size:11.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { display:inline-block; font-size:10px; font-weight:700; color:#fff; background:var(--accent); padding:1px 5px; border-radius:4px; margin-right:4px; }
  .badge.vod { background:#6b7385; }
  .star { position:absolute; top:50%; right:6px; transform:translateY(-50%); border:0; background:none; font-size:18px; cursor:pointer; color:#c7ccd6; padding:4px; }
  .star.on { color:#f5b301; }
  .notice { flex:none; padding:8px 12px; font-size:10.5px; line-height:1.55; color:#8a91a3; border-top:1px solid var(--line); }
  .notice a { color:#4b5bd6; }

  /* 우측 하단 홈 버튼 */
  .home-fab { position:fixed; right:calc(var(--side) + 14px); bottom:14px; z-index:50; width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#6a5cff,#3c8cff); color:#fff; display:flex; align-items:center; justify-content:center; text-decoration:none; font-size:18px; box-shadow:0 4px 12px rgba(60,80,200,.35); }

  /* 핸드폰: 위(탭+화면) 고정, 채널 목록만 아래에서 스크롤 → 채널이 화면 뒤로 사라짐 */
  @media (max-width: 760px) {
    html, body { height:100%; height:100dvh; }
    body { display:flex; flex-direction:column; }
    .top { flex:none; height:auto; position:relative; z-index:5; background:var(--bg); box-shadow:0 2px 6px rgba(0,0,0,.06); }
    .tabs { padding:0 10px; }
    .wrap { height:auto; display:block; }
    .stage { padding:8px 8px 4px; }
    .player, .bar, .hint { max-width:none; }
    .player { border-radius:8px; }
    .side { flex:1 1 auto; min-height:0; width:auto; border-left:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
    .list { overflow:visible; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); }
    .home-fab { right:14px; }
  }

  * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea { -webkit-user-select:text; user-select:text; }
</style>
</head>
<body>
<div class="top">
  <nav class="tabs" id="tabs"></nav>
  <script>
  (function(){
    var emb = true; try { emb = window.self !== window.top; } catch(e) {}
    if (emb && /[?&]nav=1(&|$)/.test(location.search)) document.body.classList.add("navswap");
    window.addEventListener("message", function(e){ if (e.origin === location.origin && e.data && e.data.type === "MYWAY_NAVSWAP_OFF") document.body.classList.remove("navswap"); });
  })();
  </script>
  <div class="wrap" id="wrap">
    <section class="stage">
      <div class="player" id="player"><div class="empty">오른쪽에서 채널을 선택하세요</div></div>
      <div class="bar">
        <div class="now" id="now"></div>
        <div class="mode" id="mode">
          <button type="button" data-m="live">🔴 라이브</button>
          <button type="button" data-m="latest">▶ 최신 회차</button>
        </div>
      </div>
      <div class="hint" id="hint"></div>
    </section>
  </div>
</div>
<a class="home-fab" href="https://myway.kr" target="_top" title="MYWAY.KR 홈">⌂</a>

<script>
/* ───── 채널 목록 (유튜브 공식 채널 ID) ─────
   mode: 처음 눌렀을 때 보여 줄 화면 — live(지금 생방송) / latest(최신 회차·업로드 목록)
   ※ 채널 라이브 주소(live_stream)는 방송이 없거나 동시에 2개 이상 생방송 중이면 "재생할 수 없음"이 떠서
     기본은 최신 회차, 라이브는 버튼으로. vid가 있으면(24시간 방송) 그 영상으로 라이브 고정
   cat: 상단 분류 탭 */
const CHANNELS = [
  { slug:"3pro",      name:"삼프로TV",               cat:"경제",      id:"UChlv4GSd7OQl3js-jkLOnFA", mode:"latest",   desc:"경제 · 아침 라이브" },
  { slug:"syuka",     name:"슈카월드",               cat:"경제",      id:"UCsJ6RuBiTVWRX156FVbeaGg", mode:"latest", desc:"경제 · 정기 라이브" },
  { slug:"ytnradio",  name:"YTN 라디오",             cat:"시사",      id:"UCwRljhjVWtLqAKbsWGPU_OA", vid:"SMQJyQ0UMvI", mode:"live", desc:"24시간 듣는 라디오" },
  { slug:"hanpan",    name:"CBS 박재홍의 한판승부",  cat:"시사",      id:"UCV9gIwasozKlwz5U2Sa2q6g", mode:"latest",   desc:"CBS 라디오 · 평일 저녁" },
  { slug:"ytnsisa",   name:"YTN 시사",               cat:"시사",      id:"UCvWUqUT10RiJ6W8XiruqAiQ", mode:"latest", desc:"보도 · 시사 프로그램" },
  { slug:"gyeomson",  name:"겸손은힘들다 뉴스공장",  cat:"시사",      id:"UCAAvO0ehWox1bbym3rXKBZw", mode:"latest",   desc:"시사 토크 · 아침 라이브" },
  { slug:"sinsa",     name:"신의한수",               cat:"시사",      id:"UCgOLQwRv1r2m9mhE1tfsn3Q", mode:"latest",   desc:"시사 토크 · 라이브" },
  { slug:"jiyoon",    name:"김지윤의 지식Play",      cat:"교양",      id:"UCXql5C57vS4ogUt6CPEWWHA", mode:"latest", desc:"국제정치 · 역사 · 문화" },
  { slug:"videomug",  name:"비디오머그",             cat:"교양",      id:"UCMEbRpvuwTbXxGiyDb1mT8w", mode:"latest", desc:"SBS 지식뉴스" },
  { slug:"chim",      name:"침착맨",                 cat:"예능·토크", id:"UCUj6rrhMTR9pipbAWBAMvUQ", mode:"latest", desc:"토크 · 다시보기" },
  { slug:"chimlive",  name:"침착맨 원본 박물관",     cat:"예능·토크", id:"UCewitUbsXnyjvJjGgxa0IYw", mode:"latest",   desc:"침착맨 생방송 송출" }
];
const CATS = ["전체", "즐겨찾기", "경제", "시사", "교양", "예능·토크"];

const FAV_KEY = "mywayPodcastFavsV1";
let favs = [];
try { favs = JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(e) {}
let currentCat = "전체", curSlug = "", curMode = "live";

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* 좁은 화면이면 채널 목록을 화면 아래로, 넓으면 오른쪽으로 */
const side = document.createElement("aside");
side.className = "side";
side.innerHTML = `<div class="list" id="grid"></div>
  <footer class="notice">ⓘ 각 채널이 유튜브에 공개한 <b>공식 라이브·영상</b>을 그대로 연결해 보여 주는 <b>비영리 개인 사이트</b>입니다. 영상을 저장하거나 다시 올리지 않습니다.
  권리자 요청이 있으면 즉시 삭제합니다. · <a href="https://myway.kr" target="_top">myway.kr</a></footer>`;
function placeSide(){
  const narrow = window.matchMedia("(max-width: 760px)").matches;
  if (narrow) { if (side.parentNode !== document.body) document.body.insertBefore(side, document.querySelector(".home-fab")); }
  else { if (side.parentNode !== $("wrap")) $("wrap").appendChild(side); }
}
placeSide();
window.addEventListener("resize", placeSide);

function saveFavs(){ try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e) {} }
const inCat = c => currentCat === "전체" ? true : currentCat === "즐겨찾기" ? favs.includes(c.slug) : c.cat === currentCat;

function renderTabs(){
  $("tabs").innerHTML = '<button type="button" class="nav-back" data-back="1" title="마이웨이 메뉴로 돌아가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>메뉴</button>' + CATS.map(c => `<button class="${c===currentCat?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
}
function renderGrid(){
  const list = CHANNELS.filter(inCat);
  $("grid").innerHTML = list.length ? list.map(c => `
    <div class="card ${c.slug===curSlug?'on':''}" data-slug="${esc(c.slug)}">
      <b>${esc(c.name)}</b>
      <div class="meta"><span class="badge ${c.vid?'':'vod'}">${c.vid?'24H':'VOD'}</span>${esc(c.desc)}</div>
      <button class="star ${favs.includes(c.slug)?'on':''}" data-fav="${esc(c.slug)}" title="즐겨찾기">★</button>
    </div>`).join("")
    : `<div style="padding:16px;color:#8a91a3;font-size:13px">${currentCat==="즐겨찾기" ? "★을 눌러 즐겨찾기를 추가하세요" : "채널이 없습니다"}</div>`;
}
function renderMode(){
  Array.prototype.forEach.call($("mode").querySelectorAll("button"), b => b.classList.toggle("on", b.dataset.m === curMode));
  $("hint").textContent = !curSlug ? "" : curMode === "live"
    ? "지금 생방송 중일 때만 나와요. '재생할 수 없음'이 뜨면 생방송이 없는 시간이에요 → [▶ 최신 회차]"
    : "최근 올라온 영상 목록이 나와요 (재생목록 버튼으로 다른 회차 선택)";
}

function play(slug, mode){
  const c = CHANNELS.find(x => x.slug === slug) || CHANNELS[0];
  curSlug = c.slug; curMode = mode || c.mode;
  const q = "autoplay=1&mute=1&playsinline=1&rel=0";
  const src = curMode === "live"
    ? (c.vid ? `https://www.youtube.com/embed/${c.vid}?${q}` : `https://www.youtube.com/embed/live_stream?channel=${c.id}&${q}`)
    : `https://www.youtube.com/embed/videoseries?list=UU${c.id.slice(2)}&${q}`;
  $("player").innerHTML = `<iframe src="${src}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="${esc(c.name)}"></iframe>`;
  $("now").innerHTML = `${esc(c.name)}<small>${esc(c.cat)} · ${curMode === "live" ? "라이브" : "최신 회차"}</small>`;
  renderMode(); renderGrid();
  try { history.replaceState(null, "", "#" + c.slug); } catch(e) {}
}

$("tabs").addEventListener("click", e => {
  if (e.target.closest("button[data-back]")) { try { parent.postMessage({ type: "MYWAY_NAVSWAP_BACK" }, location.origin); } catch(err) {} return; }   // myway.kr 탭바 다시 보이기
  const b = e.target.closest("button[data-cat]"); if (!b) return;
  currentCat = b.dataset.cat; renderTabs();
  const first = CHANNELS.find(inCat);           // 탭을 누르면 그 탭의 첫 채널이 바로 나옴
  if (first) play(first.slug); else renderGrid();
  side.scrollTop = 0; $("grid").scrollTop = 0;
});
$("grid").addEventListener("click", e => {
  const s = e.target.closest("[data-fav]");
  if (s) { e.stopPropagation(); const k = s.dataset.fav; favs = favs.includes(k) ? favs.filter(x => x !== k) : favs.concat(k); saveFavs(); renderGrid(); return; }
  const card = e.target.closest(".card"); if (card) play(card.dataset.slug);
});
$("mode").addEventListener("click", e => { const b = e.target.closest("button[data-m]"); if (b && curSlug) play(curSlug, b.dataset.m); });

renderTabs();
const h = location.hash.slice(1);
play(CHANNELS.some(c => c.slug === h) ? h : CHANNELS[0].slug);
</script>

<script>
/* 복사 방지 */
(function(){
  const block = e => { const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return; e.preventDefault(); };
  ["contextmenu","selectstart","dragstart","copy","cut"].forEach(ev => document.addEventListener(ev, block));
  document.addEventListener("keydown", e => {
    const k = (e.key || "").toLowerCase();
    if (k === "f12" || (e.ctrlKey && ["u","s","c","x","a"].includes(k)) || (e.ctrlKey && e.shiftKey && ["i","j","c"].includes(k))) e.preventDefault();
  });
})();
</script>
</body>
</html>
