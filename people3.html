/* ⛶ 크게 보기 — 핸드폰에서 유튜브 자체 전체화면 버튼이 안 먹을 때를 위해: 영상 칸을 화면 전체로 (지원 안 하는 아이폰은 이 화면 안에서 꽉 채우기) */
/* 아이폰은 유튜브 자체 전체화면이 안 될 때가 있어 ⛶ 크게 버튼을 아이폰에서도 보여 줌 */
try { if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) document.documentElement.classList.add("is-ios"); } catch(e) {}
/* 아이폰은 전체화면 기능이 없어서: 이 화면 안에서 꽉 채우고, 바깥 화면(barsite·index)에도 알려 탭·헤더까지 덮게 함 */
function bigTell(on){ try { if (parent !== window) parent.postMessage({ type:"MYWAY_BIG", on:!!on }, "*"); } catch(e) {} }
window.addEventListener("pagehide", function(){ bigTell(false); });
function bigView(el){
  if (!el) return;
  const d = document, on = d.fullscreenElement || d.webkitFullscreenElement;
  if (on) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
  if (el.classList.contains("big-fill")) { el.classList.remove("big-fill"); const x = el.querySelector(".big-x"); if (x) x.remove(); bigTell(false); return; }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  const fill = () => { el.classList.add("big-fill"); const x = document.createElement("button"); x.type = "button"; x.className = "big-x"; x.textContent = "✕ 작게"; x.onclick = () => bigView(el); el.appendChild(x); bigTell(true);
    /* 영상 칸이 사라지면(목록으로 돌아감 등) 바깥 화면도 원래대로 */
    const t = setInterval(() => { if (!el.isConnected || !el.classList.contains("big-fill")) { clearInterval(t); if (!document.querySelector(".big-fill")) bigTell(false); } }, 700); };
  if (req && (d.fullscreenEnabled || d.webkitFullscreenEnabled)) {
    try { const p = req.call(el); if (p && p.then) p.then(() => { try { screen.orientation.lock("landscape").catch(() => {}); } catch(e) {} }).catch(fill); } catch(e) { fill(); }
  } else fill();
}

    /* ============ 갤러리 렌더 (1회) ============ */
    function renderGallery() {
      const root = document.getElementById('masonryGallery');
      const frag = document.createDocumentFragment();
      people.forEach((p, idx) => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = p.url || '#';
        a.target = '_blank';
        a.rel = 'noopener';
        a.dataset.cats = (p.cats || []).join(' ');
        a.dataset.i = idx;
        a.setAttribute('aria-label', p.name);

        if (!p.img) {
          const nc = document.createElement('div');
          nc.className = 'namecard nc-' + ((p.cats||[])[0] || 'etc');
          const t1 = document.createElement('b'); t1.textContent = p.name; nc.appendChild(t1);
          const t2 = document.createElement('small'); t2.textContent = (p.cats||[]).map(catLabel).join(' · '); nc.appendChild(t2);
          const t3 = document.createElement('i'); t3.textContent = '▶ YouTube'; nc.appendChild(t3);
          a.appendChild(nc);
          a.classList.add('has-nc');
        } else {
        const img = document.createElement('img');
        img.src = p.img;
        img.alt = p.name;
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        a.appendChild(img);
        }

        const cap = document.createElement('div');
        cap.className = 'cap';
        cap.textContent = p.name;
        a.appendChild(cap);

        if (SHOW_EDIT) {
          const ctrl = document.createElement('div');
          ctrl.className = 'card-ctrl';
          const mk = (t, title, fn, cls) => {
            const b = document.createElement('button');
            b.type = 'button'; b.textContent = t; b.title = title; if(cls) b.className = cls;
            b.onclick = e => { e.preventDefault(); e.stopPropagation(); fn(); };
            return b;
          };
          ctrl.appendChild(mk('◀', '왼쪽으로', () => moveItem(idx, -1)));
          ctrl.appendChild(mk('✏', '수정', () => openDlg(idx)));
          ctrl.appendChild(mk('✕', '삭제', () => deleteItem(idx), 'del'));
          ctrl.appendChild(mk('▶', '오른쪽으로', () => moveItem(idx, 1)));
          a.appendChild(ctrl);
          a.addEventListener('click', e => { if(editMode) e.preventDefault(); });
        }

        frag.appendChild(a);
      });
      root.replaceChildren(frag);
      refreshNav();
    }

    /* ============ 카테고리 네비 (동적) ============ */
    function applyFilter(code){
      curFilter = code; if (document.body.classList.contains('feed-mode')) histClosed(); document.body.classList.remove('feed-mode');
      var cards = document.querySelectorAll('#masonryGallery .card');
      cards.forEach(function(c){
        var cats = (c.dataset.cats||'').split(/\s+/);
        c.style.display = (code==='all' || cats.indexOf(code)>=0) ? '' : 'none';
      });
      var sub=document.getElementById('filterSub'); if(sub) sub.textContent = (code==='all' ? '전체' : catLabel(code));
      try { sessionStorage.setItem('mywayCat_people3', code); } catch(_) {}
    }
    function buildCatNav(){
      var nav=document.getElementById('catNav'); nav.innerHTML='';
      function mkBtn(code,label,count){
        var b=document.createElement('button');
        b.className='cat-btn'+(curFilter===code?' is-active':'');
        b.dataset.cat=code;
        var c=document.createElement('span'); c.className='count'; c.textContent=(count==null?'':count);
        b.appendChild(document.createTextNode(label+' ')); b.appendChild(c);
        b.onclick=function(){ curFilter=code; nav.querySelectorAll('.cat-btn').forEach(function(x){x.classList.remove('is-active');}); b.classList.add('is-active'); applyFilter(code); };
        return b;
      }
      nav.appendChild(mkBtn('all','전체', people.length));
      CATS.forEach(function(cat){
        var n=people.filter(function(p){ return (p.cats||[]).indexOf(cat.code)>=0; }).length;
        nav.appendChild(mkBtn(cat.code, cat.label, n));
      });
      var fb=document.createElement('button'); fb.type='button'; fb.className='cat-btn feed-btn'+(document.body.classList.contains('feed-mode')?' is-active':''); fb.textContent='🔔 새 영상'; fb.onclick=function(){ nav.querySelectorAll('.cat-btn').forEach(function(x){x.classList.remove('is-active');}); fb.classList.add('is-active'); try{ sessionStorage.setItem('ypScroll', 0); }catch(_){} location.href=location.pathname+'?feed=1'; }; nav.appendChild(fb);
    }
    function refreshNav(){ buildCatNav(); applyFilter(curFilter); }

    /* ============ 보정 프리셋 (제거됨) ============ */

    /* ===== 편집 동작 ===== */
    function moveItem(i, dir){ const ni=i+dir; if(ni<0||ni>=people.length) return; const t=people[i]; people[i]=people[ni]; people[ni]=t; savePeople(); renderGallery(); }
    function deleteItem(i){ if(!confirm('이 항목을 삭제할까요?\n'+people[i].name)) return; people.splice(i,1); savePeople(); renderGallery(); }

    /* ===== 추가/수정 모달 ===== */
    let dlgEdit = null;
    const dlgBack = document.getElementById('dlgBack');
    function renderCatChecks(sel){
      const box = document.getElementById('dlgCats'); box.innerHTML='';
      if(!CATS.length){ box.textContent='(카테고리가 없어요 — 먼저 🧭 카테고리편집에서 추가하세요)'; return; }
      CATS.forEach(c=>{
        const lab=document.createElement('label');
        const cb=document.createElement('input'); cb.type='checkbox'; cb.value=c.code; cb.checked=sel.indexOf(c.code)>=0;
        lab.appendChild(cb); lab.appendChild(document.createTextNode(c.label));
        box.appendChild(lab);
      });
    }
    function openDlg(idx){
      dlgEdit = (idx==null ? null : idx);
      document.getElementById('dlgTitle').textContent = (idx==null ? '항목 추가' : '항목 수정');
      const p = (idx==null ? {name:'',cats:[],url:'',img:''} : people[idx]);
      document.getElementById('dlgName').value = p.name;
      document.getElementById('dlgUrl').value  = p.url;
      document.getElementById('dlgImg').value  = p.img;
      renderCatChecks(p.cats||[]);
      dlgBack.classList.add('show');
    }
    function closeDlg(){ dlgBack.classList.remove('show'); dlgEdit=null; }
    document.getElementById('dlgCancel').onclick = closeDlg;
    dlgBack.addEventListener('click', e=>{ if(e.target===dlgBack) closeDlg(); });
    document.getElementById('dlgOk').onclick = function(){
      const name = document.getElementById('dlgName').value.trim();
      let url    = document.getElementById('dlgUrl').value.trim();
      const img  = document.getElementById('dlgImg').value.trim();
      const cats = Array.prototype.slice.call(document.querySelectorAll('#dlgCats input:checked')).map(c=>c.value);
      if(!name){ alert('이름을 입력해 주세요.'); return; }
      if(!url){ alert('URL을 입력해 주세요.'); return; }
      if(!/^https?:\/\//i.test(url)) url='https://'+url;
      const rec = { name:name, cats:cats, url:url, img:img };
      if(dlgEdit==null) people.push(rec); else people[dlgEdit]=rec;
      savePeople(); renderGallery(); closeDlg();
    };

    function exportData(){

      const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});

    function importData(){
      const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,.html,.htm,text/html,application/json';
      inp.onchange=()=>{
        const f=inp.files[0]; if(!f) return;
        const r=new FileReader();
        r.onload=()=>{
          let arr=null, cats=null, foreignKind=null;
          const txt=String(r.result).replace(/^\uFEFF/, '').trim();   // BOM 제거
          // 1) JSON 우선
          try{
            const p=JSON.parse(txt);
            if(Array.isArray(p)){
              // 배열만 온 경우: code만 있으면 카테고리, 아니면 인물로 추정
              if(p.length && p[0] && p[0].code && !p[0].name && !p[0].url && !p[0].img) cats=coerceCats(p);
              else arr=coercePeople(p);
            } else if(p && typeof p==='object'){
              if(p.kind && p.kind!==DATA_KIND) foreignKind=p.kind;   // 거부 대신 표시만
              arr  = coercePeople(p.people || p.items || p.data || p.list);
              cats = coerceCats(p.cats || p.categories || p.nav);
            }
          }catch(_){}
          // 2) HTML 파일에서 추출 (마커 유무와 무관하게)
          if(!arr){ const m=txt.match(/DEFAULT_PEOPLE\s*=\s*(\[[\s\S]*?\])\s*;/); if(m){ try{ arr=coercePeople(eval('('+m[1]+')')); }catch(_){} } }
          if(!cats){ const mc=txt.match(/DEFAULT_CATS\s*=\s*(\[[\s\S]*?\])\s*;/); if(mc){ try{ cats=coerceCats(eval('('+mc[1]+')')); }catch(_){} } }
          if(!arr && !cats){ alert('읽을 수 있는 인물/카테고리 데이터가 없어요.'); return; }
          if(foreignKind){
            if(!confirm('다른 도구에서 만든 JSON일 수 있어요. (종류: '+foreignKind+')\n그래도 가져올까요?')) return;
          }
          let msg=[];
          if(cats){ CATS=cats; saveCats(); curFilter='all'; msg.push('카테고리 '+CATS.length+'개'); }
          if(arr){ people=arr; savePeople(); msg.push('항목 '+people.length+'개'); }
          buildCatNav(); renderGallery();
          alert('가져왔어요. '+(msg.join(' · ')||'(변경 없음)'));
        };
        r.readAsText(f);
      };
      inp.click();
    }

   '.cat-btn.feed-btn{background:#eef4ff;border-color:#b9cdf5;color:#2a4fa8}.cat-btn.feed-btn.is-active{background:#2a4fa8;color:#fff;border-color:#2a4fa8}'+
   '.fd-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}.fd-top .lb{font-size:13px;color:#7a8199;margin-right:4px}'+
   '.fd-chip{border:1.5px solid #dfe3ec;background:#fff;border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;font-weight:700;color:#4a5170;cursor:pointer}.fd-chip.on{background:#1f2740;color:#fff;border-color:#1f2740}'+
   '.fd-st{font-size:13px;color:#7a8199;margin-left:auto}'+
   '.fd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}'+
   '.fd-it{cursor:pointer;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(20,30,60,.07);transition:transform .18s}.fd-it:hover{transform:translateY(-3px)}'+
   '.fd-it img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee}'+
   '.fd-it .tx{padding:8px 10px 10px}.fd-it b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;line-height:1.35;color:#1f2740}'+
   '.fd-it small{display:block;margin-top:5px;font-size:12px;color:#7a8199}.fd-empty{padding:40px 0;text-align:center;color:#7a8199}'+
   '@media (max-width:600px){.fd-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.fd-it b{font-size:12.5px}}';
  document.head.appendChild(fcss);
  function renderFeed(st){
    var box=document.getElementById('feedBox'); var days=[[1,'24시간'],[3,'3일'],[7,'7일']];
    var list=(FEED||[]).filter(function(x){ return Date.now()-x.d <= feedDays*86400000; });
    box.innerHTML='<div class="fd-top"><span class="lb">올라온 지</span>'+days.map(function(d){ return '<button type="button" class="fd-chip'+(d[0]===feedDays?' on':'')+'" data-d="'+d[0]+'">'+d[1]+'</button>'; }).join('')+
      '<button type="button" class="fd-chip fd-re">↻ 다시 불러오기</button><span class="fd-st">'+(st||(list.length+'개 · 쇼츠 제외'))+'</span></div><div class="fd-grid"></div>';
    box.querySelectorAll('.fd-chip[data-d]').forEach(function(b){ b.onclick=function(){ feedDays=+b.dataset.d; renderFeed(); }; });
    box.querySelector('.fd-re').onclick=function(){ FEED=null; try{ sessionStorage.removeItem('ypFeedCache'); }catch(e){} window.ypFeed(); };
    var g=box.querySelector('.fd-grid');
    if(FEED && !list.length){ g.outerHTML='<div class="fd-empty">이 기간에 올라온 새 영상이 없어요</div>'; return; }
    list.forEach(function(x,k){ var it=document.createElement('div'); it.className='fd-it';
      it.innerHTML='<img loading="lazy" alt="" src="https://i.ytimg.com/vi/'+x.v+'/mqdefault.jpg"><div class="tx"><b></b><small></small></div>';
      it.querySelector('b').textContent=x.t; it.querySelector('small').textContent=x.ch+' · '+ago(x.d);
      it.onclick=function(){ try{ sessionStorage.setItem('ypFeedList', JSON.stringify(list)); sessionStorage.setItem('ypFeedDays', feedDays); sessionStorage.setItem('ypFeedScroll', window.scrollY||0); }catch(e){} location.href=PATH+'?fv='+k; }; g.appendChild(it); });
    var sub=document.getElementById('filterSub'); if(sub) sub.textContent='새 영상';
  }
  window.ypFeed=function(){
    document.body.classList.add('feed-mode'); histOpen(function(){ applyFilter(curFilter); buildCatNav(); }, function(){ return document.body.classList.contains('feed-mode'); }, 'feed');
    if(!FEED){ try{ var c=JSON.parse(sessionStorage.getItem('ypFeedCache')||'null'); if(c && Date.now()-c.t<15*60000){ FEED=c.items; feedDays=+sessionStorage.getItem('ypFeedDays')||feedDays; } }catch(e){} }
    if(FEED){ renderFeed(); return; }
    if(feedLoading) return; feedLoading=true;
    var chans=[], seen={};
    people.forEach(function(p){ var cid=chIdOf(p.url); if(cid && !seen[cid]){ seen[cid]=1; chans.push({ cid:cid, name:p.name }); } });
    var out=[], done=0, k=0;
    renderFeed('불러오는 중… 0/'+chans.length);
    function one(c, tries){
      return fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://www.youtube.com/feeds/videos.xml?channel_id='+c.cid))
        .then(function(r){ return r.json(); }).then(function(j){
          if(j.status!=='ok'){ if((tries||0)<3) return new Promise(function(ok){ setTimeout(ok, 2500*((tries||0)+1)); }).then(function(){ return one(c,(tries||0)+1); }); return; }
          (j.items||[]).forEach(function(i){ if(/\/shorts\//.test(i.link||'')) return; var m=String(i.link||'').match(/[?&]v=([\w-]{11})/); if(!m) return;
            var d=Date.parse(String(i.pubDate||'').replace(' ','T')+'Z'); if(isNaN(d)) return;
            out.push({ v:m[1], t:unesc(i.title||''), ch:c.name, d:d }); });
        }).catch(function(){});
    }
    function worker(){ if(k>=chans.length) return Promise.resolve(); var c=chans[k++];
      return one(c).then(function(){ done++; if(!FEED){ var s=document.querySelector('#feedBox .fd-st'); if(s) s.textContent='불러오는 중… '+done+'/'+chans.length; } return worker(); }); }
    Promise.all([worker(),worker(),worker(),worker()]).then(function(){
      out.sort(function(a,b){ return b.d-a.d; }); FEED=out; feedLoading=false;
      try{ sessionStorage.setItem('ypFeedCache', JSON.stringify({ t:Date.now(), items:out })); }catch(e){}
      if(document.body.classList.contains('feed-mode')) renderFeed();
    });
  };
  /* 카드 누르면 (편집 중이 아닐 때) 화면 안에서 재생 — 채널 ID를 모르는 카드는 원래대로 새 창 */
  window.addEventListener('click',function(e){
    if(typeof editMode!=='undefined' && editMode) return;
    var a=e.target.closest && e.target.closest('#masonryGallery .card'); if(!a) return;
    if(e.target.closest('.card-ctrl')) return;
    var p=people[+a.dataset.i]; if(!p) return; var cid=chIdOf(p.url); if(!cid) return;
    e.preventDefault(); e.stopPropagation(); try{ sessionStorage.setItem('ypScroll', window.scrollY||0); }catch(_){}
    location.href=PATH+'?ch='+cid+'&n='+encodeURIComponent(p.name);
  }, true);
  /* 주소에 따라 처음 화면 정하기 */
  function restoreScroll(key){ var y=0; try{ y=+sessionStorage.getItem(key)||0; }catch(e){} if(y>0){ [0,300,900].forEach(function(ms){ setTimeout(function(){ window.scrollTo(0,y); },ms); }); } }
  if(QS.ch && /^UC[\w-]{22}$/.test(QS.ch)) open({ name: QS.n||'' }, QS.ch);
  else if(QS.fv!=null){ var fl=[]; try{ fl=JSON.parse(sessionStorage.getItem('ypFeedList')||'[]'); }catch(e){} if(fl.length) openIds('🔔 새 영상', fl, Math.min(+QS.fv||0, fl.length-1)); else location.replace(PATH+'?feed=1'); }
  else if(QS.feed){ window.ypFeed(); var fbn=document.querySelector('.feed-btn'); if(fbn){ document.querySelectorAll('#catNav .cat-btn').forEach(function(x){ x.classList.remove('is-active'); }); fbn.classList.add('is-active'); } restoreScroll('ypFeedScroll'); }
  else restoreScroll('ypScroll');
  /* 백버튼으로 돌아왔을 때 화면이 멈춘 채 복원되면(아이폰) 다시 그림 */
  window.addEventListener('pageshow', function(e){ if(e.persisted && (QS.ch||QS.fv!=null)) location.reload(); });
})();
    if(SHOW_EDIT){ buildToolbar(); document.addEventListener('click', function(e){ if(toolOpen && !e.target.closest('.edit-toolbar')) closeTool(); }); }
  </script>
<script>
/* 모바일: 외부 링크를 최상위 창에서 열어 뒤로가기로 MYWAY 복귀. PC·태블릿은 새 탭. */
(function(){
  if(!/Mobi/i.test(navigator.userAgent)) return;
  document.addEventListener("click", function(e){
    if(document.body.classList.contains('editing')) return;
    var a = e.target.closest ? e.target.closest("a[href]") : null;
    if(!a) return;
    var href = a.getAttribute("href") || "";
    if(!href || href.charAt(0) === "#" || /^javascript:/i.test(href)) return;
    e.preventDefault();
    try { (window.top || window).location.href = a.href; }
    catch(_) { window.open(a.href, "_blank"); }
  }, true);
  var _open = window.open.bind(window);
  window.open = function(url, name, feat){
    if(url){ try{ (window.top||window).location.href = url; }catch(_){ location.href = url; } return null; }
    return _open(url, name, feat);
  };
})();
</script>
