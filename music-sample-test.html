<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MYWAY Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#0c0d14; --bg2:#14151f; --bg3:#1c1e2b; --line:#272a3a; --ink:#f3f2f8; --sub:#a3a6ba; --dim:#6f7388;
    --a1:#7ed6fb; --a2:#7d6fe8; --a3:#b176f3; --bar:93px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;
       -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;overflow:hidden;}
  input{user-select:text;-webkit-user-select:text;}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--a1);outline-offset:2px;}
  .app{height:100%;display:flex;flex-direction:column;}
  /* 배경: 지금 재생 중인 가수의 색으로 은은하게 물듦 */
  .glow{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;transition:background .6s;
        background:radial-gradient(900px 480px at 22% -8%, var(--g1,#2b2f6b) 0%, transparent 70%),radial-gradient(700px 420px at 92% 0%, var(--g2,#3a2456) 0%, transparent 70%);}

  /* ── 상단 ── */
  .top{position:relative;z-index:3;flex:none;display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid var(--line);background:rgba(12,13,20,.72);backdrop-filter:blur(14px);}
  .find{flex:1 1 0;min-width:0;max-width:520px;display:flex;align-items:center;gap:10px;height:42px;padding:0 15px;border-radius:12px;background:var(--bg3);border:1px solid var(--line);}
  .find svg{width:17px;height:17px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round;flex:none;}
  .find input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:14.5px;}
  .find input::placeholder{color:var(--dim);}
  .top .sp{flex:1;}
  .tag{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;}

  /* ── 본문 ── */
  .main{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;padding:0 0 calc(var(--bar) + 28px);scrollbar-width:thin;scrollbar-color:#3a3d52 transparent;}
  .wrap{max-width:1320px;margin:0 auto;padding:0 28px;}
  .chips{position:relative;display:flex;gap:8px;overflow-x:auto;padding:18px 0 4px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none;height:36px;padding:0 15px;border-radius:10px;background:var(--bg3);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--sub);transition:.15s;}
  .chip:hover{color:var(--ink);border-color:#3a3e55;}
  .chip.on{background:var(--ink);color:#11121a;border-color:var(--ink);}
  .chip .n{margin-left:6px;font-weight:500;opacity:.6;font-size:12px;}
  .sec{margin-top:30px;}
  .sec-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;}
  .sec-h .eyebrow{display:block;font-size:11.5px;letter-spacing:.14em;color:var(--dim);font-weight:700;margin-bottom:3px;}
  .sec-h h2{margin:0;font-family:Fraunces,Pretendard,serif;font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1;}
  .sec-h .sp{flex:1;}
  .ghost{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--sub);display:inline-flex;align-items:center;gap:7px;}
  .ghost:hover{color:var(--ink);border-color:#444861;}
  .ghost svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* 커버(이미지 없으면 장르색 + 첫 글자) */
  .cv{position:relative;flex:none;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(140deg,var(--c1),var(--c2));font-family:Fraunces,Pretendard,serif;font-weight:800;color:rgba(255,255,255,.92);}
  .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

  /* 내 음악: 하단 카드 줄 (직접 고른 영상·재생목록·곡 목록) */
  .shelf{position:fixed;left:0;right:0;bottom:0;z-index:5;height:var(--bar);display:flex;align-items:stretch;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
         background:rgba(18,19,28,.95);border-top:1px solid var(--line);backdrop-filter:blur(16px);}
  body.playing-view{--bar:76px;}
  body.playing-view .shelf{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));}
  body.playing-view .sc,body.playing-view .sc .cv{width:106px;}
  body.playing-view .sc .cv{height:60px;}
  /* 하단 맨 왼쪽 [가수] — 어느 화면에서든 누르면 가수 목록으로 (뒤로가기가 안 되는 아이폰용) */
  .singer-tile{flex:none;width:128px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:7px;color:#fff;
               background:radial-gradient(120% 140% at 25% 0%,#5a2a96 0%,#2a1450 55%,#120a26 100%);border:1px solid #6d4bb8;box-shadow:0 0 0 0 rgba(177,118,243,0);transition:box-shadow .18s, transform .15s;}
  .singer-tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(177,118,243,.35);}
  .singer-tile i{font-style:normal;font-size:22px;line-height:1;}
  .singer-tile b{font-family:Fraunces,Pretendard,serif;font-size:19px;font-weight:800;background:linear-gradient(95deg,#ff9bd6,#b9a4ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  body.playing-view .singer-tile{width:106px;border-color:var(--a1);box-shadow:0 0 0 2px rgba(126,214,251,.25);}
  .shelf-add{flex:none;width:64px;border-radius:12px;border:1px dashed #4a4e68;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;}
  .shelf-add:hover{color:var(--ink);border-color:var(--a2);background:rgba(125,111,232,.12);}
  .shelf-add i{font-style:normal;font-size:20px;line-height:1.2;font-weight:400;}
  .shelf-row{flex:1;min-width:0;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab;}
  .shelf-row::-webkit-scrollbar{display:none;}
  .sc{position:relative;flex:none;width:128px;}
  .sc .go{display:block;width:100%;text-align:left;}
  .sc .cv{width:128px;height:72px;border-radius:10px;font-size:24px;transition:transform .15s;}
  .sc .go:hover .cv{transform:translateY(-2px);}
  .sc.on .cv{outline:2px solid var(--a1);outline-offset:1px;}
  .sc .badge{position:absolute;left:6px;top:6px;z-index:1;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.72);font-family:Pretendard,sans-serif;font-size:10.5px;font-weight:700;color:#fff;}
  .sc .ed{position:absolute;right:5px;top:5px;z-index:2;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;font-size:13px;line-height:1;opacity:0;transition:opacity .15s;}
  .sc:hover .ed,.sc .ed:focus-visible{opacity:1;}
  @media (hover:none){ .sc .ed{opacity:1;} }
  .dragging{cursor:grabbing !important;scroll-behavior:auto !important;}
  .dragging *{pointer-events:none;}
  .mini{margin-left:10px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg3);font-size:13px;line-height:1;vertical-align:middle;position:relative;top:-3px;opacity:.8;transition:.15s;}
  .mini:hover{opacity:1;border-color:var(--a2);transform:translateY(-1px);}
  /* 음악 사이트 바로가기 — 좁은 화면에서는 좌우로 밀어서 봄 */
  .sites{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none;cursor:grab;}
  .sites::-webkit-scrollbar{display:none;}
  .site{flex:none;width:72px;text-align:center;text-decoration:none;color:var(--sub);}
  .site .ic{width:60px;height:60px;margin:0 auto;border-radius:16px;overflow:hidden;background:var(--bg3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
            font-size:15px;font-weight:800;color:var(--ink);box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .18s, box-shadow .18s, border-color .18s;}
  .site .ic img{width:100%;height:100%;object-fit:cover;display:block;}
  .site:hover .ic{transform:translateY(-3px);border-color:#4a4e68;box-shadow:0 14px 28px rgba(0,0,0,.5);}
  .site span{display:block;margin-top:7px;font-size:11.5px;font-weight:600;line-height:1.25;word-break:keep-all;}
  .site:hover span{color:var(--ink);}
  .site-gap{flex:1 0 18px;align-self:flex-start;margin-top:12px;height:36px;border-right:1px solid var(--line);margin-right:4px;}
  .site.act .ic{background:linear-gradient(140deg,#3a2f7a,#6a3fb0);border-color:#7d6fe8;font-size:24px;font-weight:500;color:#fff;}
  .site.act:hover .ic{border-color:var(--a1);box-shadow:0 14px 28px rgba(125,111,232,.45);}
  .site.act{display:block;}
  .site.act span{color:var(--ink);}
  .arrow{width:36px;padding:0;justify-content:center;font-size:18px;}
  /* 내 음악 재생 화면: 곡 추가 줄 · 곡 빼기 */
  body.my-mode .tabs button[data-tab="same"]{display:none;}
  .qadd{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.05);}
  .qadd input,.mbox input,.mbox textarea{flex:1;min-width:0;width:100%;padding:0 13px;border-radius:10px;background:var(--bg3);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px;outline:0;}
  .qadd input{height:40px;}
  .qadd input:focus,.mbox input:focus,.mbox textarea:focus{border-color:var(--a2);}
  .qadd input::placeholder,.mbox input::placeholder,.mbox textarea::placeholder{color:var(--dim);}
  .btn-a{flex:none;height:40px;padding:0 18px;border-radius:10px;background:linear-gradient(135deg,var(--a2),var(--a3));color:#fff;font-size:14px;font-weight:700;}
  div.q{cursor:pointer;}
  .q .mdel{flex:none;width:34px;height:34px;border-radius:50%;color:var(--dim);font-size:19px;line-height:1;}
  .q .mdel:hover{color:#ff9a9a;background:rgba(255,255,255,.08);}
  /* 내 음악 추가·수정 창 */
  .modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,6,10,.72);backdrop-filter:blur(4px);}
  .modal[hidden]{display:none;}
  .mbox{width:100%;max-width:560px;max-height:100%;overflow-y:auto;padding:20px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.6);}
  .mbox h3{margin:0 0 14px;font-size:18px;font-weight:800;}
  .mbox label{display:block;margin-bottom:12px;font-size:12.5px;font-weight:600;color:var(--sub);}
  .mbox input{display:block;height:42px;margin-top:6px;}
  .mbox input[type=file]{display:none;}
  .mbox textarea{display:block;margin-top:6px;padding:10px 13px;line-height:1.5;resize:vertical;min-height:92px;user-select:text;-webkit-user-select:text;}
  .mlabel{margin-bottom:8px;font-size:12.5px;font-weight:600;color:var(--sub);}
  .mlabel small{font-weight:400;color:var(--dim);font-size:12px;}
  .srow{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
  .srow .mv{flex:none;display:flex;flex-direction:column;gap:2px;}
  .srow .mv button{width:22px;height:18px;border-radius:5px;background:var(--bg3);border:1px solid var(--line);font-size:9px;line-height:1;color:var(--sub);}
  .srow .mv button:disabled{opacity:.3;cursor:default;}
  .mbox .srow input{display:block;height:38px;margin-top:0;padding:0 10px;font-size:13.5px;}
  .mbox .srow .s-url{flex:1.5 1 0;}
  .mbox .srow .s-name{flex:1 1 0;}
  .srow .s-del{flex:none;width:30px;height:30px;border-radius:50%;color:var(--dim);font-size:14px;}
  .srow .s-del:hover{color:#ff9a9a;background:rgba(255,255,255,.08);}
  .row-add{height:34px;margin:2px 0 14px;font-size:12.5px;border-radius:10px;}
  .mmsg{min-height:18px;margin-bottom:10px;font-size:12.5px;color:#ff9a9a;}
  .mbtns{display:flex;align-items:center;gap:8px;}
  .mbtns .sp{flex:1;}
  .mbtns .ghost{height:40px;border-radius:10px;}
  .mbtns .danger{color:#ff9a9a;}
  html.role-live .svrow{display:none !important;}   /* 음악 화면의 저장 창에는 카드 파일 가져오기·내보내기만 */
  .svrow{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:12.5px;line-height:1.5;color:var(--sub);}
  .svrow button{flex:none;width:150px;height:40px;border-radius:10px;justify-content:center;}
  .shelf-add,.mini{display:none !important;}   /* 추가·내보내기·저장은 음악 사이트 줄 오른쪽 버튼으로 옮김 */
  html:not(.edit) .shelf-add,html:not(.edit) .sc .ed,html:not(.edit) .qadd,html:not(.edit) .q .mdel{display:none !important;}
  .mfoot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);}
  .mfoot .ghost{height:32px;font-size:12.5px;}

  /* 장르 카드 줄 */
  .moods{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;scroll-behavior:smooth;cursor:grab;}
  .moods::-webkit-scrollbar{display:none;}
  .mood{flex:none;width:188px;height:64px;border-radius:12px;padding:8px 14px;text-align:left;position:relative;overflow:hidden;
        background:linear-gradient(150deg,var(--c1),var(--c2));transition:transform .18s;}
  .mood:hover{transform:translateY(-3px);}
  .mood::after{content:"";position:absolute;right:-22px;bottom:-40px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.16);}
  .mood b{position:absolute;left:14px;bottom:8px;font-size:16.5px;font-weight:800;line-height:1.2;text-shadow:0 1px 10px rgba(0,0,0,.35);}
  .mood small{position:absolute;left:14px;top:9px;line-height:1.2;font-size:11px;font-weight:700;letter-spacing:.06em;opacity:.85;}

  /* 가수 그리드 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:20px 16px;}
  .card{text-align:left;min-width:0;}
  .card .cv{width:100%;aspect-ratio:1;border-radius:12px;font-size:46px;transition:transform .18s, box-shadow .18s;}
  .card:hover .cv{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.45);}
  .card .play{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(6px);transition:.18s;}
  .card .play svg{width:16px;height:16px;fill:#11121a;margin-left:2px;}
  .card:hover .play{opacity:1;transform:none;}
  .card b{display:block;margin-top:10px;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card span{display:block;margin-top:2px;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .empty{padding:50px 0;text-align:center;color:var(--dim);font-size:14px;}
  .foot{margin:44px 0 0;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);text-align:center;}
  .foot a{color:var(--a1);text-decoration:none;}

  /* ── 재생 화면: 위에 영상(고정), 아래에 곡 목록(목록만 스크롤) ── */
  .now{display:none;}
  body.playing-view .home,body.playing-view .foot{display:none;}
  body.playing-view .main{overflow:hidden;padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px));}
  body.playing-view .wrap{height:100%;}
  body.playing-view .now{display:flex;flex-direction:column;height:100%;}
  .now-grid{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;width:100%;max-width:1040px;margin:0 auto;padding:14px 0;}
  .side-head{flex:none;display:flex;align-items:center;gap:14px;min-width:0;min-height:52px;padding:0 8px 0 12px;border-bottom:1px solid var(--line);}
  .back{flex:none;height:34px;padding:0 13px 0 9px;}
  .stage{position:relative;flex:none;width:min(100%, calc(42vh * 16 / 9));margin:0 auto;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 20px 50px rgba(0,0,0,.5);}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .meta{flex:1;min-width:0;display:flex;align-items:center;gap:11px;}
  .meta .cv{width:34px;height:34px;border-radius:8px;font-size:15px;}
  .meta>div:last-child{min-width:0;}
  .meta h1{margin:0;font-family:Fraunces,Pretendard,serif;font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meta p{margin:1px 0 0;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .side{flex:1;min-height:0;display:flex;flex-direction:column;background:rgba(20,21,31,.72);border:1px solid var(--line);border-radius:16px;overflow:hidden;backdrop-filter:blur(10px);}
  .tabs{flex:none;display:flex;}
  .tabs button{flex:1;height:52px;padding:0 14px;white-space:nowrap;font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--dim);border-bottom:2px solid transparent;}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--ink);}
  .queue{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#3a3d52 transparent;}
  .q{display:flex;align-items:center;gap:13px;width:100%;padding:8px 16px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05);}
  .q:hover{background:rgba(255,255,255,.05);}
  .q.on{background:rgba(125,111,232,.2);}
  .q .cv{width:44px;height:44px;border-radius:7px;font-size:17px;}
  .q .t{flex:1;min-width:0;}
  .q b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .q span{display:block;margin-top:2px;font-size:12.5px;color:var(--sub);}
  .q .no{flex:none;width:22px;text-align:center;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;}
  .q.on .no{display:none;}
  .q .cv.th{width:64px;height:36px;border-radius:6px;background:#1c1e2b;}
  .q b.wait{color:var(--dim);font-weight:500;}
  .q[data-t] .eq{width:22px;padding:0 3px;}
  .qnote{padding:26px 18px;font-size:13.5px;line-height:1.7;color:var(--sub);text-align:center;}
  .qhead{padding:11px 16px;font-size:12.5px;color:var(--dim);border-bottom:1px solid rgba(255,255,255,.05);}
  .q .eq{flex:none;width:16px;height:14px;display:none;align-items:flex-end;gap:2px;}
  .q.on .eq{display:flex;}
  .q .eq i{flex:1;background:var(--a1);border-radius:1px;height:40%;}
  body.is-playing .q.on .eq i{animation:eq 0.9s ease-in-out infinite;}
  .q .eq i:nth-child(2){animation-delay:.2s !important;height:90%;}
  .q .eq i:nth-child(3){animation-delay:.4s !important;height:60%;}
  @keyframes eq{0%,100%{height:25%}50%{height:100%}}

  .homebtn{position:fixed;right:18px;bottom:calc(var(--bar) + 16px);z-index:6;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
           background:linear-gradient(135deg,var(--a2),var(--a3));box-shadow:0 8px 22px rgba(0,0,0,.45);text-decoration:none;}

  }
  function saveHtml(edit){   if (M2_ROLE !== 'edit') return;   /* HTML 저장은 편집용 파일에서만 */
    /* edit=true: 편집용 파일(music-sample-edit.html) / false: 올릴 파일(music-sample.html) — 둘 다 지금 카드가 그대로 담김 */
    var name = edit ? 'music-sample-edit.html' : 'music-sample.html';
    try {
      var blob = new Blob([buildHtml(edit)], { type:'text/html;charset=utf-8' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
      $('svMsg').textContent = name + ' 을(를) 저장했어요. (카드 ' + cards.length + '장)';
    } catch(e){ $('svMsg').textContent = '저장하지 못했어요.'; window.alert('저장하지 못했어요.'); }
  }

  /* 가로 줄: 마우스로 끌어서 좌우 이동 (터치는 원래대로), wheel=true면 휠로도 좌우 이동 */
  function hscroll(el, wheel){
    var sx = 0, sl = 0, down = false, moved = false;
    el.addEventListener('pointerdown', function(e){ if (e.pointerType !== 'mouse' || e.button !== 0) return; down = true; moved = false; sx = e.clientX; sl = el.scrollLeft; });
    window.addEventListener('pointermove', function(e){
      if (!down) return; var dx = e.clientX - sx;
      if (!moved && Math.abs(dx) > 6){ moved = true; el.classList.add('dragging'); }
      if (moved) el.scrollLeft = sl - dx;
    });
    window.addEventListener('pointerup', function(){ if (!down) return; down = false; if (moved) setTimeout(function(){ el.classList.remove('dragging'); moved = false; }, 0); });
    el.addEventListener('click', function(e){ if (moved){ e.preventDefault(); e.stopPropagation(); } }, true);
    if (wheel) el.addEventListener('wheel', function(e){ if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && el.scrollWidth > el.clientWidth){ el.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive:false });
  }

  function play(i){
    var p = i === MY_IDX ? MYP : SG[i]; if (!p || !p.u) return;
    /* 지금 재생 중인 가수를 다시 누르면 처음부터 다시 틀지 않고 재생 화면만 다시 엶 */
    if (i !== MY_IDX && i === curIdx && $('ytFrame')){ openNow(); renderQueue(); try { if (ready) player.playVideo(); } catch(e){} return; }
    document.body.classList.remove('mine-mode');
    var hadCard = !!curCard; man = null; if (i !== MY_IDX) curCard = null;
    curIdx = i; pendingDone = false; if (trackOwner !== i || i === MY_IDX){ trackIds = []; }
    document.body.classList.toggle('my-mode', i === MY_IDX); if (i === MY_IDX) tracksTab(); else if (hadCard) renderShelf();
    var c = col(p);
    $('glow').style.setProperty('--g1', c[0]); $('glow').style.setProperty('--g2', c[1]);
    $('metaCv').outerHTML = '<div class="cv" id="metaCv" ' + cover(p) + '</div>';
    $('metaName').textContent = p.n; $('metaSub').textContent = (p.card ? '내 음악' : catLabel(p)) + ' · 유튜브 재생목록';
    openNow();
    renderQueue();
    var k = parse(p.u);
    if (ready && player){
      try {
        if (k.list) loadList(k.list, k.v); else loadVid(k.v);
        return;
      } catch(e){}
    }
    if (player){ try { player.destroy(); } catch(e){} player = null; ready = false; }
    $('stage').innerHTML = '<iframe id="ytFrame" title="재생 화면" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen src="' + esc(embedUrl(p.u)) + '"></iframe>';
    attachApi(); if (window.YT && YT.Player) bind();
  }

  /* ── 이벤트 ── */
  document.addEventListener('click', function(e){
    var tr = e.target.closest('.q[data-t]');
    if (tr){ if (ready) try { if (trackIds.length > 1) player.playVideoAt(+tr.dataset.t); else player.playVideo(); } catch(err){} return; }
    if (e.target.id === 'cardModal'){ closeEdit(); return; }
    if (e.target.id === 'saveModal'){ e.target.hidden = true; return; }
    var x1 = e.target.closest('[data-mdel]'); if (x1){ manDel(+x1.dataset.mdel); return; }
    var mu = e.target.closest('[data-mup]'); if (mu){ mineMove(+mu.dataset.mup, -1); return; }
    var md = e.target.closest('[data-mdn]'); if (md){ mineMove(+md.dataset.mdn, 1); return; }
    if (e.target.closest('#mineDone')){ mineDone(); return; }
    if (e.target.closest('[data-pickclose]')){ pickClose(); return; }
    var pk = e.target.closest('[data-pick]'); if (pk){ pickSinger(+pk.dataset.pick); return; }
    var pa = e.target.closest('.q[data-add]'); if (pa){ pickToggle(pa.dataset.add); return; }
    if (e.target.closest('#mineBtn')){ openMine(); return; }
    if (e.target.closest('#manAddBtn')){ manAdd(); return; }
    var x2 = e.target.closest('.q[data-m]'); if (x2){ if (!e.target.closest('input')) manPlay(+x2.dataset.m); return; }
    var x3 = e.target.closest('[data-edit]'); if (x3){ openEdit(+x3.dataset.edit); return; }
    var x4 = e.target.closest('[data-card]'); if (x4){ playCard(+x4.dataset.card); return; }
    var t = e.target.closest('[data-i]'); if (t){ play(+t.dataset.i); return; }
    var c = e.target.closest('.chip,.mood');
    if (c){ var cw = $('chips'), sl = cw.scrollLeft; curCat = c.dataset.c; renderChips(); cw.scrollLeft = sl; renderHome(); $('main').scrollTop = 0; chipCenter(); return; }
    var tb = e.target.closest('.tabs button');
    if (tb){ sideTab = tb.dataset.tab; Array.prototype.forEach.call(tb.parentNode.children, function(b){ b.classList.toggle('on', b === tb); }); renderQueue(); }
  });
  $('find').addEventListener('input', function(){ query = this.value; closeNow(); renderHome(); });
  document.addEventListener('input', function(e){ if (e.target && e.target.id === 'manUrl' && isMine()){ var t = e.target.value; if (!allVids(t).length) pickSearch(t, true); } });
  $('backBtn').addEventListener('click', function(){ closeNow(); });
  /* [가수]: 재생 화면이면 가수 목록으로 돌아가고, 가수 목록에서는 맨 위(전체)로 */
  $('singerTile').addEventListener('click', function(){
    if (document.body.classList.contains('playing-view')){ closeNow(); return; }
    if (curCat !== 'all' || query){ curCat = 'all'; query = ''; $('find').value = ''; renderChips(); renderHome(); }
    try { $('main').scrollTo({ top: 0, behavior: 'smooth' }); } catch(e){ $('main').scrollTop = 0; }
  });
  $('cardAddBtn').addEventListener('click', function(){ openEdit(-1); });
  $('sites').addEventListener('click', function(e){
    var a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'add') openEdit(-1);
    else if (a.dataset.act === 'export') saveHtml(false);
    else if (a.dataset.act === 'save'){ $('svMsg').textContent = ''; $('saveModal').hidden = false; }
  });
  $('saveOpenBtn').addEventListener('click', function(){ $('svMsg').textContent = ''; $('saveModal').hidden = false; });
  $('importOpenBtn').addEventListener('click', function(){ $('myFile').click(); });
  $('miniExport').addEventListener('click', function(){ saveHtml(true); });   /* 음악2: 지금 이 파일 전체(모양 + 하단 카드)를 편집용 파일로 내보내기 → 항상 최신 편집기 */
  $('svClose').addEventListener('click', function(){ $('saveModal').hidden = true; });
  $('svDist').addEventListener('click', function(){ saveHtml(false); });
  $('svEdit').addEventListener('click', function(){ saveHtml(true); });
  if (M2_ROLE === 'edit') document.title = 'MYWAY Music 편집용';
  $('cmSave').addEventListener('click', saveEdit);
  $('cmRowAdd').addEventListener('click', function(){ var r = addRow('', ''); try { r.querySelector('.s-url').focus(); } catch(e){} });
  $('cmRows').addEventListener('click', function(e){
    var row = e.target.closest('.srow'); if (!row) return;
    if (e.target.closest('.s-del')){ if ($('cmRows').children.length <= 1){ row.querySelector('.s-url').value = ''; row.querySelector('.s-name').value = ''; } else row.remove(); rowMove(); }
    else if (e.target.closest('.s-up') && row.previousElementSibling){ $('cmRows').insertBefore(row, row.previousElementSibling); rowMove(); }
    else if (e.target.closest('.s-down') && row.nextElementSibling){ $('cmRows').insertBefore(row.nextElementSibling, row); rowMove(); }
  });
  $('cmCancel').addEventListener('click', closeEdit);
  $('cmDel').addEventListener('click', delEdit);
  $('cmLeft').addEventListener('click', function(){ moveEdit(-1); });
  $('cmRight').addEventListener('click', function(){ moveEdit(1); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !$('cardModal').hidden){ closeEdit(); return; }
    if (e.key === 'Escape' && !$('saveModal').hidden){ $('saveModal').hidden = true; return; }
    if (e.key === 'Enter' && e.target && e.target.id === 'manUrl'){ e.preventDefault(); manAdd(); return; }
    if (e.key === 'Enter' && e.target && (e.target.id === 'cmName' || e.target.id === 'cmImg' || (e.target.closest && e.target.closest('#cmRows')))){ e.preventDefault(); saveEdit(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('.q[data-m]')){ e.preventDefault(); manPlay(+e.target.dataset.m); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('.q[data-add]')){ e.preventDefault(); pickToggle(e.target.dataset.add); }
  });
  hscroll($('chips')); hscroll($('sites')); hscroll($('shelfRow'), true);
  $('myExportBtn').addEventListener('click', myExport);
  $('myImportBtn').addEventListener('click', function(){ $('myFile').click(); });
  $('myFile').addEventListener('change', function(){ if (this.files && this.files[0]) myImport(this.files[0]); this.value = ''; });

  /* 포털 안(iframe)에서 열리면 홈 버튼·샘플 표시는 숨김 — 포털에 이미 있음 */
  try { if (window.top !== window.self) document.documentElement.classList.add('embedded'); } catch(e){ document.documentElement.classList.add('embedded'); }
  renderChips(); renderSites(); renderHome(); renderShelf(); mineCount();
})();

/* 복사 방지 */
(function(){
  ['contextmenu','selectstart','dragstart','copy','cut'].forEach(function(ev){
    document.addEventListener(ev, function(e){ var t = e.target; if (t && t.closest && t.closest('input,textarea')) return; e.preventDefault(); }, true);
  });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase(), c = e.ctrlKey || e.metaKey, inField = e.target && e.target.closest && e.target.closest('input,textarea');
    if (e.key === 'F12' || (c && ['u','s'].indexOf(k) > -1) || (c && !inField && ['c','x','a'].indexOf(k) > -1) || (c && e.shiftKey && ['i','j','c'].indexOf(k) > -1)){ e.preventDefault(); e.stopPropagation(); }
  }, true);
})();
</script>
</body>
</html>
